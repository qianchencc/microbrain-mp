
    <div class="composer-band">
      <form class="composer" @submit.prevent="sendMessage">
        <textarea
          v-model="input"
          rows="1"
          maxlength="200"
          :disabled="composerDisabled"
          placeholder="输入设备指令"
          aria-label="设备指令"
          @keydown.enter.exact.prevent="sendMessage"
        ></textarea>
        <button
          v-if="isRunning"
          class="icon-button icon-button--stop"
          type="button"
          title="停止"
          aria-label="停止"
          @click="stopRun"
        >
          <Square :size="17" fill="currentColor" />
        </button>
        <button
          v-else
          class="icon-button"
          type="submit"
          title="发送"
          aria-label="发送"
          :disabled="composerDisabled || !input.trim()"
        >
          <Send :size="18" />
        </button>
      </form>
    </div>

