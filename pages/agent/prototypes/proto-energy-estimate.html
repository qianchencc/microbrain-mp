<!doctype html>
<!--
  PROTOTYPE — throwaway, do not ship.
  Question: 任务完成通知中的空调节能反馈，应该怎样表达才清楚、克制且有情绪价值？
  ?variant=a|b|c：A 结果内联 / B 指标网格 / C 温度叙事。
  ?case=estimate|unavailable：切换有估算依据与暂无法可靠估算。
  流程：通知中心 → 任务详情 → 执行报告；所有设备数量、计算公式和结果使用同一组样例事实。
  样例事实：纳入 6 台，调节 5 台，1 台无需调整，跳过 0 台；目标 26℃。
  打开：python3 -m http.server 8767 → http://127.0.0.1:8767/pages/agent/prototypes/proto-energy-estimate.html
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务报告节能反馈 · Prototype</title>
<style>
:root {
  --paper:#f4f7f5; --ink:#263a2e; --ink-2:#345241; --muted:#7b8b80; --muted-2:#9aa69e;
  --jade:#176b54; --jade-2:#2d8b6e; --jade-soft:#e3efe8; --gold:#b47c2d; --gold-soft:#fbf2df;
  --red:#a35345; --red-soft:#faece8; --line:#dfe8e1; --white:#fff;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:#e7ece9;color:var(--ink);font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:14px 10px 76px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.phone{width:min(375px,calc(100vw - 20px));height:min(790px,calc(100dvh - 94px));min-height:580px;background:#101713;border-radius:42px;padding:10px;box-shadow:0 28px 70px #18302540,0 3px 14px #18302524}
.screen{height:100%;overflow:hidden;position:relative;border-radius:34px;background:var(--paper);display:flex;flex-direction:column}
.status{height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 21px;flex-shrink:0;color:#355442;font-size:11px;font-weight:650}.status span:last-child{font-size:10px;letter-spacing:.6px;opacity:.7}
.nav{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #e1e8e2;background:linear-gradient(#fcfdfc,#f5f8f5);flex-shrink:0}.back{width:34px;height:34px;border-radius:12px;font-size:23px;color:#42614e}.back:active{background:#e7efe9}.nav-title{min-width:0;flex:1}.nav-title b{display:block;font-size:14px;line-height:1.2}.nav-title small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.nav-action{width:31px;height:31px;border-radius:11px;color:#567162;font-size:17px}.nav-action:active{background:#e7efe9}
.body{min-height:0;flex:1;overflow:hidden;position:relative}.scroll{height:100%;overflow:auto;padding:18px 15px 28px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.notice-list{display:grid;gap:10px}.notice{position:relative;display:flex;gap:10px;padding:13px 12px 13px 14px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#fff,#f8fbf8);box-shadow:0 4px 12px #3754430d;text-align:left}.notice:active{transform:scale(.985)}.notice.unread:before{content:"";position:absolute;left:6px;top:16px;width:5px;height:5px;border-radius:50%;background:var(--jade-2)}.notice-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:11px;background:var(--jade-soft);color:var(--jade);font-size:16px;flex-shrink:0}.notice-copy{min-width:0;flex:1}.notice-title{display:block;font-size:13px;font-weight:650;line-height:1.35}.notice-meta{display:block;margin-top:4px;color:var(--muted);font-size:10.5px;line-height:1.35}.notice-time{color:var(--muted-2);font-size:10px;white-space:nowrap;padding-top:1px}
.section-kicker{display:flex;align-items:center;justify-content:space-between;margin:1px 2px 11px;color:var(--muted);font-size:11px;letter-spacing:.2px}.section-kicker b{color:var(--ink-2);font-size:15px;letter-spacing:0}.unread-count{padding:3px 7px;border-radius:9px;color:var(--jade);background:var(--jade-soft);font-size:10px}
.detail{animation:in .28s var(--ease)}@keyframes in{from{opacity:0;transform:translateX(9px)}}
.task-head{padding:2px 2px 16px}.task-label{display:block;font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.35}.task-sub{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;color:var(--muted);font-size:10.5px}.tag{padding:4px 7px;border-radius:7px;background:#e9f2ec;color:#47705a}.tag.ok{background:var(--jade-soft);color:var(--jade)}
.timeline{display:flex;flex-direction:column;gap:0;margin:0 0 16px;padding:0 2px}.checkpoint{display:grid;grid-template-columns:25px minmax(0,1fr);min-height:56px}.rail{position:relative;display:flex;justify-content:center}.rail:after{content:"";position:absolute;top:14px;bottom:-1px;width:1px;background:#cbdacf}.checkpoint:last-child .rail:after{display:none}.dot{z-index:1;width:9px;height:9px;margin-top:5px;border:2px solid var(--jade);border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px var(--paper)}.cp-copy{padding:0 0 13px}.cp-head{display:flex;gap:8px;align-items:baseline}.cp-time{font-size:12px;font-weight:700;color:var(--jade)}.cp-title{font-size:12px;font-weight:650}.cp-note{display:block;margin-top:4px;color:var(--muted);font-size:10.5px;line-height:1.45}
.report{border-top:1px solid var(--line);padding-top:16px}.report-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.report-label b{font-size:14px}.report-label span{font-size:10px;color:var(--jade);padding:4px 7px;border-radius:7px;background:var(--jade-soft)}
.hero{padding:15px;border:1px solid #d7e6db;border-radius:17px;background:linear-gradient(145deg,#f7fcf8,#eaf5ed);box-shadow:inset 0 1px #fff;margin-bottom:11px}.hero-unavailable{background:linear-gradient(145deg,#fffaf0,#fbf3e4);border-color:#eddfc4}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.hero-number{font-size:29px;line-height:1;font-weight:760;letter-spacing:-1px;color:var(--jade)}.hero-number small{font-size:13px;letter-spacing:0;font-weight:600;margin-left:4px}.hero-unavailable .hero-number{font-size:18px;line-height:1.35;color:#986927;letter-spacing:-.2px}.hero-label{margin-top:7px;color:#5b7966;font-size:11px}.hero-unavailable .hero-label{color:#9a7a47}.hero-badge{padding:5px 8px;border-radius:8px;background:#fff8;color:#547361;font-size:10px;white-space:nowrap}.hero-foot{margin-top:13px;padding-top:10px;border-top:1px solid #d8e7dc;color:#68816f;font-size:10px;line-height:1.45}.hero-unavailable .hero-foot{border-color:#eddfc4;color:#997c4c}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.fact{padding:9px 8px;border:1px solid var(--line);border-radius:11px;background:#fff}.fact b{display:block;font-size:14px;color:var(--ink-2)}.fact span{display:block;margin-top:4px;color:var(--muted);font-size:9.5px;white-space:nowrap}
.basis{padding:12px;border-radius:13px;background:#fff;border:1px solid var(--line);margin-bottom:11px}.basis-title{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:650}.basis-title button{color:var(--jade);font-size:10px}.formula{margin-top:8px;padding:8px 9px;border-radius:8px;background:#f4f8f5;color:#476856;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;white-space:normal}.basis-note{display:block;margin-top:7px;color:var(--muted);font-size:10px;line-height:1.4}
.devices{display:grid;gap:0;border-top:1px solid var(--line)}.device-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;align-items:center;padding:10px 2px;border-bottom:1px solid #e8eee9;font-size:11px}.device-row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.device-row .before{color:var(--muted)}.device-row .after{color:var(--jade);font-weight:650}.device-row .same{color:#8b7a5c}.device-row em{font-style:normal;font-size:9px;color:var(--muted-2)}
.variant-a .report{margin-top:3px}.variant-a .hero{display:flex;align-items:center;justify-content:space-between;gap:12px}.variant-a .hero-foot{margin:0;padding:0;border:0;max-width:145px;text-align:right}.variant-a .hero-label{margin-top:5px}.variant-a .basis{margin-top:9px}
.variant-b .hero{padding:16px}.variant-b .hero-top{display:block}.variant-b .hero-badge{display:inline-block;margin-top:10px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}.metric{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.metric b{display:block;font-size:19px;line-height:1.1;color:var(--ink-2)}.metric b small{font-size:10px;font-weight:600}.metric span{display:block;margin-top:6px;color:var(--muted);font-size:10px;line-height:1.35}.metric.accent{background:#eff7f1;border-color:#d7e8db}.metric.accent b{color:var(--jade)}.variant-b .basis{margin-top:11px}
.variant-c .hero{background:#fff;border-color:var(--line);padding:14px}.temperature-title{display:flex;justify-content:space-between;align-items:baseline}.temperature-title b{font-size:13px}.temperature-title span{font-size:10px;color:var(--muted)}.temp-rail{position:relative;height:76px;margin:15px 8px 4px}.temp-line{position:absolute;left:0;right:0;top:38px;height:4px;border-radius:4px;background:linear-gradient(90deg,#e2aa72,#b8c796 48%,#81b59e)}.target-line{position:absolute;top:13px;bottom:10px;width:1px;border-left:1px dashed var(--jade);left:75%}.target-label{position:absolute;top:0;left:75%;transform:translateX(-50%);font-size:9px;color:var(--jade);white-space:nowrap}.temp-dot{position:absolute;top:32px;width:16px;height:16px;transform:translateX(-50%);border:3px solid #fff;border-radius:50%;background:#cf9460;box-shadow:0 1px 3px #31524133}.temp-dot.adjusted{background:#5ba082}.temp-dot.same{background:#c4a269}.temp-dot:after{content:"";position:absolute;top:18px;left:50%;width:1px;height:12px;background:#bccfc2}.temp-dot span{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:9px;color:#6e7c72;white-space:nowrap}.temp-axis{display:flex;justify-content:space-between;color:var(--muted-2);font-size:9px}.temp-legend{display:flex;gap:10px;margin-top:11px;color:var(--muted);font-size:9.5px}.legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}.variant-c .basis{margin-top:11px}
.actions{display:flex;gap:8px;margin-top:17px}.primary,.secondary{height:38px;border-radius:13px;font-size:12px;font-weight:650}.primary{flex:1;color:#fff;background:linear-gradient(155deg,#2b896d,#145c46);box-shadow:0 3px 8px #176b5438}.secondary{width:88px;border:1px solid var(--line);background:#fff;color:#547060}.primary:active,.secondary:active{transform:scale(.98)}
.screen-toast{position:absolute;left:50%;bottom:14px;z-index:80;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:8px 12px;border-radius:10px;background:#1b2e24eF;color:#eff8f2;font-size:11px;transition:.22s var(--ease);white-space:nowrap}.screen-toast.show{opacity:1;transform:translate(-50%,0)}
.proto-bar{position:fixed;z-index:100;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:17px;background:#17251deF;color:#e2eee5;font-size:11px;box-shadow:0 9px 26px #10201766;white-space:nowrap}.proto-bar button{padding:3px 7px;border-radius:8px;color:inherit;font-size:13px}.proto-bar button:active{background:#ffffff1c}.proto-label{min-width:112px;text-align:center;font-size:11px;font-weight:650}.proto-sep{width:1px;height:14px;background:#ffffff26}.case{padding:4px 8px!important;border:1px solid #ffffff36;font-size:10px!important}.case.active{background:#66b99555;border-color:#9ad3b7}.proto-note{position:fixed;z-index:99;left:50%;bottom:57px;transform:translateX(-50%);padding:4px 8px;border-radius:8px;background:#ffffffD9;color:#53665a;font-size:10px;box-shadow:0 2px 8px #1830251c}
@media(max-height:670px){.phone{height:calc(100dvh - 78px);min-height:540px}.scroll{padding-top:12px}.task-head{padding-bottom:10px}.checkpoint{min-height:48px}.cp-copy{padding-bottom:8px}.hero{padding:12px}.facts{margin-bottom:8px}}
</style>
</head>
<body>
<main class="phone"><section class="screen" id="screen"></section></main>
<div class="proto-note">原型 · 内存样例，不执行真实设备操作</div>
<nav class="proto-bar" aria-label="原型控制">
  <button id="prev" aria-label="上一个变体">‹</button><span class="proto-label" id="proto-label"></span><button id="next" aria-label="下一个变体">›</button>
  <span class="proto-sep"></span><button class="case" id="toggle-case">切换不可估算</button><button class="case" id="reset">↺ 通知中心</button>
</nav>
<div class="screen-toast" id="toast"></div>
<script>
const q = new URLSearchParams(location.search);
const variants = [
  { key:'a', name:'A · 结果内联' },
  { key:'b', name:'B · 指标网格' },
  { key:'c', name:'C · 温度叙事' },
];
let variant = variants.some(v => v.key === q.get('variant')) ? q.get('variant') : 'a';
let resultCase = q.get('case') === 'unavailable' ? 'unavailable' : 'estimate';
let route = 'inbox';

const facts = {
  included: 6, adjusted: 5, unchanged: 1, skipped: 0, target: 26,
  beforeAvg: 24.5, rise: 1.5, rate: 7, power: 2.5, hours: 2,
  saved: 2.625, cost: 2.10,
};

function setUrl() {
  const next = new URL(location.href);
  next.searchParams.set('variant', variant);
  next.searchParams.set('case', resultCase);
  history.replaceState({}, '', next);
}
function icon(type) { return type === 'bell' ? '◌' : type === 'task' ? '⌁' : '✓'; }
function renderNav(title, sub, back) {
  return `<header class="nav"><button class="back" id="back" aria-label="返回">${back ? '‹' : '×'}</button><div class="nav-title"><b>${title}</b><small>${sub}</small></div><button class="nav-action" id="nav-action">⋯</button></header>`;
}
function renderInbox() {
  return `<div class="body"><div class="scroll"><div class="section-kicker"><b>通知中心</b><span class="unread-count">1 条未读</span></div><div class="notice-list">
    <button class="notice unread" data-open="task"><span class="notice-icon">${icon('task')}</span><span class="notice-copy"><span class="notice-title">空调调温任务已完成</span><span class="notice-meta">工作日空调调至 26℃ · 已调 5 台 · 无需调整 1 台</span></span><span class="notice-time">刚刚</span></button>
    <button class="notice" data-open="task"><span class="notice-icon">${icon('bell')}</span><span class="notice-copy"><span class="notice-title">上一轮巡检有 1 台待核验</span><span class="notice-meta">查看任务结果和失败原因</span></span><span class="notice-time">昨天</span></button>
    <button class="notice" data-open="task"><span class="notice-icon">${icon('task')}</span><span class="notice-copy"><span class="notice-title">工作日关灯计划已启用</span><span class="notice-meta">下一次执行 · 今天 18:30</span></span><span class="notice-time">周一</span></button>
  </div></div></div>`;
}
function renderTimeline() {
  return `<div class="timeline"><div class="checkpoint"><div class="rail"><i class="dot"></i></div><div class="cp-copy"><div class="cp-head"><span class="cp-time">15:00</span><span class="cp-title">空调条件检查</span></div><span class="cp-note">纳入 6 台 · 5 台满足调温条件 · 1 台已是 26℃ · 结果已记录</span></div></div></div>`;
}
function renderHero() {
  if (resultCase === 'unavailable') return `<div class="hero hero-unavailable"><div class="hero-top"><div><div class="hero-number">暂无法可靠估算</div><div class="hero-label">本次已调节 ${facts.adjusted} 台空调</div></div><span class="hero-badge">口径缺失</span></div><div class="hero-foot">缺少调前温度记录，当前只确认了执行结果，不把设备数量换算成节电量。</div></div>`;
  return `<div class="hero"><div class="hero-top"><div><div class="hero-number">≈ ${facts.saved.toFixed(1)}<small>度</small></div><div class="hero-label">预计减少用电 · 估算值 · 约 ¥${facts.cost.toFixed(1)}</div></div><span class="hero-badge">非实测</span></div><div class="hero-foot">基于 ${facts.adjusted} 台实际调节设备的调前温度、经验比例和执行时长估算。</div></div>`;
}
function renderBasis() {
  if (resultCase === 'unavailable') return `<section class="basis"><div class="basis-title"><span>已确认的执行事实</span><button data-toast="已保留在任务报告中">查看依据</button></div><div class="formula">${facts.included} 台纳入 · ${facts.adjusted} 台调节 · ${facts.unchanged} 台无需调整</div><span class="basis-note">没有可比的调前温度记录，所以不展示节能数字。</span></section>`;
  return `<section class="basis"><div class="basis-title"><span>估算依据</span><button data-toast="估算依据已展开">收起依据</button></div><div class="formula">${facts.adjusted} 台 × ${facts.rise}℃ × ${facts.rate}% × ${facts.power}kW × ${facts.hours}h ≈ ${facts.saved.toFixed(2)} 度</div><span class="basis-note">采用调前平均 ${facts.beforeAvg}℃、每升高 1℃约节电 ${facts.rate}% 的经验参数；这是估算，不代表已实测节电。</span></section>`;
}
function renderDevices() {
  return `<section class="devices"><div class="device-row"><span>运营部空调 01–05</span><span class="before">24.5℃ →</span><span class="after">26℃</span></div><div class="device-row"><span>运营部空调 06</span><span class="before">26℃ →</span><span class="same">无需调整</span></div></section>`;
}
function renderVariant() {
  const body = resultCase === 'unavailable'
    ? `<div class="facts"><div class="fact"><b>${facts.included} 台</b><span>纳入范围</span></div><div class="fact"><b>${facts.adjusted} 台</b><span>实际调节</span></div><div class="fact"><b>${facts.unchanged} 台</b><span>无需调整</span></div></div>${renderBasis()}${renderDevices()}`
    : variant === 'a'
      ? `${renderHero()}<div class="facts"><div class="fact"><b>${facts.adjusted} 台</b><span>实际调节</span></div><div class="fact"><b>${facts.unchanged} 台</b><span>无需调整</span></div><div class="fact"><b>${facts.target}℃</b><span>统一目标</span></div></div>${renderBasis()}${renderDevices()}`
      : variant === 'b'
        ? `${renderHero()}<div class="metric-grid"><div class="metric accent"><b>${facts.adjusted}<small> 台</small></b><span>实际调节设备</span></div><div class="metric"><b>${facts.unchanged}<small> 台</small></b><span>已满足目标</span></div><div class="metric"><b>${facts.rise}<small>℃</small></b><span>调前平均上调</span></div><div class="metric"><b>¥${facts.cost.toFixed(1)}<small> 约</small></b><span>预计电费价值</span></div></div>${renderBasis()}${renderDevices()}`
        : `${renderHero()}<section class="hero"><div class="temperature-title"><b>调前 → 目标温度</b><span>${facts.adjusted} 台调节 · ${facts.unchanged} 台无需调整</span></div><div class="temp-rail"><div class="temp-line"></div><div class="target-line"></div><span class="target-label">目标 ${facts.target}℃</span><i class="temp-dot adjusted" style="left:22%"><span>24℃</span></i><i class="temp-dot adjusted" style="left:31%"><span>24.5℃</span></i><i class="temp-dot adjusted" style="left:39%"><span>25℃</span></i><i class="temp-dot adjusted" style="left:48%"><span>25℃</span></i><i class="temp-dot adjusted" style="left:57%"><span>25.5℃</span></i><i class="temp-dot same" style="left:75%"><span>26℃</span></i></div><div class="temp-axis"><span>22℃</span><span>24℃</span><span>26℃</span><span>28℃</span></div><div class="temp-legend"><span><i class="legend-dot" style="background:#5ba082"></i>已调节</span><span><i class="legend-dot" style="background:#c4a269"></i>无需调整</span></div></section>${renderBasis()}${renderDevices()}`;
  return `<div class="report variant-${variant}"><div class="report-label"><b>执行反馈</b><span>${resultCase === 'estimate' ? '完成 · 有估算' : '完成 · 无法估算'}</span></div>${body}<div class="actions"><button class="primary" data-toast="已复制任务摘要">复制任务摘要</button><button class="secondary" data-toast="已保留在当前任务">继续追问</button></div></div>`;
}
function renderDetail() {
  return `<div class="body"><div class="scroll detail"><div class="task-head"><span class="task-label">工作日空调调至 26℃</span><div class="task-sub"><span class="tag ok">已完成</span><span class="tag">公司 Agent</span><span>10 月 22 日</span></div></div>${renderTimeline()}${renderVariant()}</div></div>`;
}
function render() {
  const title = route === 'inbox' ? '公司 Agent' : '任务结果';
  const sub = route === 'inbox' ? '任务管理 · 通知中心' : '从通知中心进入 · 可继续追问';
  document.querySelector('#screen').innerHTML = renderNav(title, sub, route !== 'inbox') + (route === 'inbox' ? renderInbox() : renderDetail()) + `<div class="screen-toast" id="inner-toast"></div>`;
  document.querySelector('#proto-label').textContent = `${variants.find(v => v.key === variant).name} · ${resultCase === 'estimate' ? '有估算' : '不可估算'}`;
  document.querySelector('#toggle-case').textContent = resultCase === 'estimate' ? '切换不可估算' : '切换有估算';
  document.querySelector('#toggle-case').classList.toggle('active', resultCase === 'unavailable');
  document.querySelector('#back').addEventListener('click', () => { if (route === 'detail') { route = 'inbox'; render(); } });
  document.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => { route = 'detail'; render(); }));
  document.querySelectorAll('[data-toast]').forEach(el => el.addEventListener('click', () => toast(el.dataset.toast)));
}
function toast(message) { const el = document.querySelector('#toast'); el.textContent = message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove('show'), 1300); }
function cycle(delta) { const i = variants.findIndex(v => v.key === variant); variant = variants[(i + delta + variants.length) % variants.length].key; setUrl(); render(); }
document.querySelector('#prev').addEventListener('click', () => cycle(-1));
document.querySelector('#next').addEventListener('click', () => cycle(1));
document.querySelector('#toggle-case').addEventListener('click', () => { resultCase = resultCase === 'estimate' ? 'unavailable' : 'estimate'; setUrl(); render(); });
document.querySelector('#reset').addEventListener('click', () => { route = 'inbox'; render(); });
document.addEventListener('keydown', event => { if (event.target.matches('input,textarea,[contenteditable]')) return; if (event.key === 'ArrowLeft') cycle(-1); if (event.key === 'ArrowRight') cycle(1); });
setUrl(); render();
</script>
</body>
</html>
