<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway, do not ship.
  Question: 以 B6 时间轴为组件起点，区域自动化面的入口、区域切换、任务卡、底部抽屉、
  设备列表、设备时间轴、日历归属和状态提示应如何组织？
  - ?variant= 是页面结构：P1 双页签 / P2 时间轴主页 + 设备抽屉 / P3 设备货架 + 同轴过滤。
  - 次级旋钮见页面底部原型栏；全部状态写入 URL，可分享、可刷新。←/→ 切换主变体。
  - 时间轴几何从 proto-region-panel.html 的 B6 分支移植为可复用组件：railX 曲线、34px/h、
    单侧缎带、同路径裁切进度、节点与刻痕规则均不改参数（见 docs/research/proto-region-panel/b6-timeline-design.md）。
  - 接管与冲突不在本原型范围；任务只有计划 / 执行中 / 完成 / 部分完成 / 失败 / 取消。
  - 探索记录：docs/research/proto-region-panel/c1-workbench-exploration.md
  Open: 在仓库根目录 python3 -m http.server 8766 → http://127.0.0.1:8766/pages/agent/proto-region-workbench.html
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>区域工作台 · C1 Prototype</title>
<style>
  :root {
    --paper: #f4f7f5; --ink: #24382d; --ink-2: #253b30; --muted: #738278; --muted-2: #87958d;
    --jade: #176b54; --jade-deep: #11553f; --jade-soft: #e4eee8;
    --brass: #a66a13; --brass-soft: #f4eadc; --hairline: #e0e7e2; --hairline-2: #dbe3dd;
    --ease-out: cubic-bezier(.23,1,.32,1); --ease-drawer: cubic-bezier(.32,.72,0,1);
    --spring: cubic-bezier(.34,1.56,.64,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #e8ecea; color: var(--ink); -webkit-font-smoothing: antialiased;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 14px;
  }
  button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
  .phone {
    width: min(375px, calc(100vw - 20px)); height: min(780px, calc(100dvh - 140px));
    border-radius: 44px; background: #0e1512; padding: 10px;
    box-shadow: 0 30px 80px rgba(20,40,30,.28), 0 4px 16px rgba(20,40,30,.14);
  }
  .screen {
    width: 100%; height: 100%; border-radius: 36px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; background: var(--paper);
  }
  .statusbar {
    height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 11px; font-weight: 600; color: var(--ink-2); position: relative; z-index: 12;
  }
  .statusbar .sicons { opacity: .75; font-size: 10px; letter-spacing: .5px; }

  /* ================= view stack (mini program page stack) ================= */
  .views { position: relative; flex: 1; min-height: 0; }
  .view {
    position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
    background:
      radial-gradient(120% 60% at 50% -10%, #fbfdfc 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(36,56,45,.012) 0 1px, transparent 1px 3px), var(--paper);
    transition: transform .36s var(--ease-drawer), filter .36s;
    box-shadow: -10px 0 30px rgba(20,40,30,.08);
  }
  .view.off { transform: translateX(102%); }
  .view.under { transform: translateX(-24%); filter: brightness(.97); }
  .view.noanim { transition: none; }

  .navbar {
    height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 10px;
    border-bottom: 1px solid rgba(44,75,58,.05); background: linear-gradient(180deg, #fcfdfc, #f4f7f5);
    position: relative; z-index: 6;
  }
  .navbar .back { width: 30px; height: 30px; font-size: 20px; color: var(--ink-2); line-height: 1; }
  .navbar .nav-c { flex: 1; display: flex; justify-content: center; min-width: 0; }
  .navbar .nav-title { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .navbar .nav-title b { font-size: 14.5px; color: var(--ink-2); }
  .navbar .nav-title small { font-size: 10px; color: var(--muted); }
  .capsule {
    width: 74px; height: 28px; border-radius: 14px; border: 1px solid rgba(36,56,45,.14); flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-evenly; color: var(--ink-2); font-size: 13px;
    background: rgba(255,255,255,.5);
  }
  .capsule i { width: 1px; height: 16px; background: rgba(36,56,45,.12); }

  /* ================= region chip (shared public attribute) ================= */
  .rchip {
    position: relative; display: inline-flex; align-items: center; gap: 7px; height: 30px; max-width: 100%;
    padding: 0 11px 0 10px; border-radius: 15px; color: var(--ink-2); font-size: 13px; font-weight: 650;
    background: linear-gradient(#fff, #f2f5f3);
    box-shadow: inset 0 0 0 .5px rgba(26,55,43,.18), inset 0 1px 0 #fff, 0 1px 2px rgba(28,57,42,.08);
    transition: transform 140ms var(--ease-out);
  }
  .rchip:active { transform: scale(.97); }
  .rchip .rpin { width: 7px; height: 7px; border-radius: 50%; background: var(--jade); box-shadow: 0 0 0 2.5px var(--jade-soft); flex-shrink: 0; }
  .rchip .rname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rchip .car { font-size: 8px; color: var(--muted-2); }
  .rchip .rdot, .hdot {
    position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; border-radius: 50%;
    background: #b57932; box-shadow: 0 0 0 1.5px #fff;
  }

  /* ================= Agent screen (entry) ================= */
  .ahead { flex-shrink: 0; background: linear-gradient(180deg,#fcfdfc,#f4f7f5); border-bottom: 1px solid rgba(44,75,58,.05); }
  .abar { position: relative; height: 46px; display: flex; align-items: center; padding: 0 104px 0 16px; }
  .identity { display: flex; align-items: center; gap: 8px; }
  .identity .mark {
    width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg,#308b70,#11553f); border: 1px solid rgba(14,70,50,.2); color: #fff; font-size: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 4px rgba(21,74,51,.12);
  }
  .identity .atitle { font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .identity .sdot { width: 5px; height: 5px; border-radius: 50%; background: #31866a; box-shadow: 0 0 0 2px #e4eee8; }
  .identity .car { font-size: 9px; color: var(--muted-2); }
  .abar .capsule { position: absolute; right: 12px; top: 9px; }
  .actx { display: flex; align-items: center; gap: 8px; padding: 2px 14px 10px; }
  .panel-entry {
    position: relative; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px;
    border-radius: 15px; font-size: 12px; font-weight: 600; color: var(--jade-deep);
    background: linear-gradient(#f3f8f5, #e6efe9); box-shadow: inset 0 0 0 .5px rgba(23,107,84,.22), inset 0 1px 0 #fff;
  }
  .panel-entry svg { width: 15px; height: 15px; }
  .conv { flex: 1; overflow-y: auto; padding: 14px 16px 18px; scrollbar-width: none; display: flex; flex-direction: column; gap: 10px; }
  .conv::-webkit-scrollbar { display: none; }
  .msg-u {
    align-self: flex-end; max-width: 80%; padding: 9px 12px; border-radius: 14px 14px 4px 14px;
    background: linear-gradient(145deg,#2f8a6f,#17644c); color: #fff; font-size: 13px; line-height: 1.55;
    box-shadow: 0 4px 10px -6px rgba(17,85,63,.5);
  }
  .msg-a { max-width: 92%; font-size: 13px; line-height: 1.65; color: var(--ink-2); }
  .msg-a .alink { color: var(--jade); font-weight: 600; margin-left: 4px; }
  .msg-div { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted-2); margin: 4px 0; }
  .msg-div::before, .msg-div::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
  .msg-div b { color: var(--jade-deep); font-weight: 650; }
  .conv-empty { margin: auto; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; }
  .conv-empty b { display: block; color: var(--ink-2); font-size: 14px; }
  .ctask {
    border-radius: 12px; overflow: hidden; background: linear-gradient(#fff,#fafcfa); cursor: pointer;
    box-shadow: inset 0 0 0 .5px rgba(26,55,43,.12), inset 0 1px 0 #fff, 0 1px 2px rgba(28,57,42,.06), 0 8px 20px rgba(28,57,42,.05);
    transition: transform 140ms var(--ease-out), box-shadow .3s;
  }
  .ctask:active { transform: scale(.985); }
  .ctask.flash { box-shadow: inset 0 0 0 1.5px var(--jade), 0 8px 20px rgba(23,107,84,.18); }
  .ctask .ct-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
  .ctask .ct-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 650; color: var(--ink-2); }
  .ctask .ct-when { padding: 0 12px 9px; font-size: 11px; color: var(--muted); }
  .ctask .ct-foot {
    display: flex; justify-content: space-between; padding: 8px 12px; font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--hairline); background: #f8faf8;
  }
  .ctask .ct-foot b { color: var(--jade); font-weight: 650; }
  .composer { flex-shrink: 0; display: flex; gap: 8px; padding: 8px 14px 18px; }
  .cbox {
    flex: 1; min-height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 20px;
    background: #fff; box-shadow: inset 0 0 0 1px #dfe6e1; font-size: 13.5px; color: #8b9991;
  }
  .cbox.filled { color: var(--ink-2); box-shadow: inset 0 0 0 1.5px rgba(23,107,84,.45); }
  .cbox.filled::after { content: ""; width: 1.5px; height: 16px; margin-left: 2px; background: var(--jade); animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .send { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg,#308b70,#11553f); color: #fff; font-size: 16px; }

  /* ================= panel ================= */
  .pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .pageslider { flex-shrink: 0; display: flex; position: relative; margin: 2px 16px 0; border-bottom: 1px solid var(--hairline); }
  .pageslider .thumb { position: absolute; bottom: -1px; left: 0; height: 2px; width: 50%; background: var(--jade); border-radius: 1px; transition: transform .28s var(--ease-out); }
  .pageslider .seg { flex: 1; font-size: 14px; font-weight: 550; padding: 9px 0 10px; color: var(--muted-2); letter-spacing: .04em; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .pageslider .seg.on { color: var(--ink-2); font-weight: 650; }
  .pageslider .seg .cnt { font-size: 10px; color: var(--muted-2); font-weight: 600; }
  .pager { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .track { display: flex; height: 100%; width: 200%; transition: transform .3s var(--ease-out); }
  .page { width: 50%; height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .page.plain { overflow-y: auto; scrollbar-width: none; }
  .page.plain::-webkit-scrollbar { display: none; }
  .dock {
    position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 5; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 13px; font-weight: 600;
    background: linear-gradient(145deg, #308b70, var(--jade-deep)); box-shadow: 0 10px 24px rgba(17,85,63,.3), inset 0 1px 0 rgba(255,255,255,.18);
    transition: transform 140ms var(--ease-out);
  }
  .dock:active { transform: scale(.98); }
  .dock .plus { font-size: 17px; font-weight: 400; }
  .dock2 {
    position: absolute; left: 50%; bottom: 14px; z-index: 5; transform: translateX(-50%); display: flex; align-items: center;
    height: 44px; padding: 4px; border-radius: 22px; background: linear-gradient(#fefffe,#f1f5f2);
    box-shadow: inset 0 0 0 .5px rgba(26,55,43,.16), inset 0 1px 0 #fff, 0 10px 26px rgba(28,57,42,.18);
  }
  .dock2 button { height: 36px; padding: 0 16px; border-radius: 18px; font-size: 12.5px; font-weight: 650; color: var(--ink-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dock2 .d2new { background: linear-gradient(145deg,#308b70,var(--jade-deep)); color: #fff; }
  .dock2 b { font-size: 11px; color: var(--muted); }
  .dock2 svg { width: 15px; height: 15px; }

  /* ================= calendar (owned by a timeline instance, or by the page in K-page) ================= */
  .cal { flex-shrink: 0; padding: 8px 16px 4px; position: relative; z-index: 5; }
  .cal[hidden] { display: none; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 7px; cursor: pointer; user-select: none; }
  .cal-head .cm { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
  .cal-head .ct { font-size: 10.5px; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-d { text-align: center; padding: 5px 0 6px; border-radius: 9px; font-size: 11px; color: var(--ink-2); cursor: pointer; position: relative; font-weight: 500; }
  .cal-d .wd { display: block; font-size: 9px; color: var(--muted-2); font-weight: 400; margin-bottom: 1px; }
  .cal-d.other { color: #b9c4bd; }
  .cal-d .has { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); width: 3px; height: 3px; border-radius: 50%; background: var(--jade); }
  .cal-d.today { color: var(--jade-deep); font-weight: 700; }
  .cal-d.sel { box-shadow: inset 0 0 0 1.5px var(--jade); color: var(--jade-deep); font-weight: 700; }
  .cal-grip { width: 34px; height: 3px; border-radius: 2px; background: #d3dcd6; margin: 6px auto 0; }
  .cal.compact { padding: 6px 12px 4px; margin: 0 12px; border-radius: 12px; background: linear-gradient(#fff,#f7faf8); box-shadow: inset 0 0 0 .5px rgba(26,55,43,.12), 0 6px 16px rgba(28,57,42,.08); }
  .cal.compact .cal-cap { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); padding: 2px 4px 5px; }
  .cal.compact .cal-cap b { color: var(--ink-2); font-weight: 650; }
  .cal.pagecal.inert { opacity: .38; pointer-events: none; }
  .cal-note { font-size: 10px; color: var(--brass); text-align: center; padding: 0 0 4px; }

  /* ================= B6 timeline (ported, geometry frozen) ================= */
  .tl { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .tlscroll { flex: 1; overflow-y: auto; position: relative; scrollbar-width: none; }
  .tlscroll::-webkit-scrollbar { display: none; }
  .tlwrap { position: relative; }
  .tlwrap svg.rail { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
  .glab {
    position: absolute; left: 0; width: 36px; text-align: right; font-size: 10px; font-weight: 600; color: var(--muted);
    transform: translateY(-50%); line-height: 1.2; z-index: 1; font-variant-numeric: tabular-nums;
  }
  .glab.event { color: #45564d; font-size: 11px; font-weight: 620; }
  .glab.tick { color: #aab7ae; font-size: 9px; font-weight: 450; }
  .glab.tick.past { color: #bcc8bf; }
  .glab.now { color: #99651b; line-height: 1.12; }
  .glab.now .caption { display: block; font-size: 9.5px; font-weight: 650; }
  .glab.now .clock { display: block; font-size: 12px; font-weight: 750; }
  .daytick {
    position: absolute; left: 84px; right: 14px; z-index: 1; font-size: 10px; font-weight: 600; letter-spacing: .12em;
    color: #a9b6ae; display: flex; align-items: center; gap: 10px; transform: translateY(-50%); justify-content: center;
  }
  .daytick::before, .daytick::after { content: ""; flex: 1; height: 1px; background: var(--hairline); opacity: .8; }
  .datefloat {
    position: absolute; top: 10px; right: 12px; z-index: 7; background: rgba(23,107,84,.92); color: #fff;
    font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 14px; box-shadow: 0 4px 14px rgba(17,85,63,.28);
    pointer-events: none;
  }
  .datefloat.interactive { pointer-events: auto; cursor: pointer; }
  .datefloat.interactive::after { content: " ▾"; font-size: 9px; opacity: .8; }
  .tl.cal-open .datefloat.interactive::after { content: " ▴"; }
  .tl-empty { margin: 70px 30px 0; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; }
  .tl-empty b { display: block; font-size: 14px; color: var(--ink-2); margin-bottom: 2px; }
  .tl-empty .rail-art { width: 60px; height: 80px; margin: 0 auto 10px; display: block; }

  /* thin card */
  .tcard {
    position: absolute; left: 84px; right: 14px; z-index: 1; height: 32px; display: flex; align-items: center; gap: 7px;
    padding: 0 7px 0 11px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(#fefffe, #f9fbf9);
    box-shadow: inset 0 0 0 .5px rgba(26,55,43,.13), inset 0 1px 0 #fff, 0 1px 2px rgba(28,57,42,.05), 0 6px 14px -10px rgba(28,57,42,.2);
    transition: transform 140ms var(--ease-out), opacity .2s;
  }
  .tlwrap.overlap .tcard { left: 112px; }
  .tcard.enter { animation: cardIn .4s var(--ease-out) backwards; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .tcard:active { transform: scale(.985); }
  .tcard .tn { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
  .tcard .tn em { font-style: normal; color: var(--muted-2); font-weight: 500; margin-left: 6px; font-size: 11px; }
  .tcard.past { opacity: .6; }
  .tcard.past.warn { opacity: .86; }
  .tcard.cancelled { opacity: .42; }
  .tcard.cancelled .tn { text-decoration: line-through; text-decoration-color: rgba(36,56,45,.35); }
  .tcard.running { box-shadow: inset 0 0 0 1px rgba(23,107,84,.32), inset 0 1px 0 #fff, 0 6px 16px -10px rgba(23,107,84,.45); }
  .tcard.running::before { content: ""; position: absolute; left: 4px; top: 9px; bottom: 9px; width: 2.5px; border-radius: 2px; background: var(--jade); }
  .tcard .flag { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #b57932; box-shadow: 0 0 0 2px var(--brass-soft); margin-right: 7px; vertical-align: 1px; }
  .tcard .tsep { width: 1px; height: 14px; background: var(--hairline-2); flex-shrink: 0; }
  .osrc { flex-shrink: 0; font-size: 9px; font-weight: 700; letter-spacing: .06em; padding: 2px 5px; border-radius: 5px; }
  .osrc.task { color: var(--jade-deep); background: var(--jade-soft); }
  .osrc.draft { color: #3f5a66; background: #e4ecef; }
  .osrc.human { color: #6a5327; background: #f3ecdc; }
  .rs { flex-shrink: 0; font-size: 9.5px; font-weight: 650; }
  .rs.ok { color: var(--jade); } .rs.noop { color: var(--muted-2); font-weight: 500; }
  .rs.fail { color: var(--brass); } .rs.run { color: var(--jade-deep); } .rs.cx { color: var(--muted-2); }

  /* avatar group (animate-ui 式叠放：悬停抬升 + 名称气泡) */
  .agroup { display: flex; align-items: center; flex-shrink: 0; }
  .av {
    position: relative; width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1.5px #fdfefd, 0 1px 2px rgba(28,57,42,.2); transition: transform 280ms var(--spring);
    font-size: 9.5px; font-weight: 700;
  }
  .agroup .av + .av { margin-left: -7px; }
  .av .face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 28%, #fdfcf7, #e3e7e1 62%, #cbd3cd); }
  .av .face img { width: 165%; height: 165%; object-fit: contain; }
  .av .face b { font-size: 9px; color: #5f6e66; font-weight: 700; }
  .av.more { background: linear-gradient(#f4f6f4,#e6ebe7); color: #5f6e66; font-size: 8.5px; }
  .av.owner { color: #fff; }
  .av.jade { background: linear-gradient(145deg,#3a9478,#11553f); }
  .av.brass { background: linear-gradient(145deg,#c9923f,#8e5a12); }
  .av.slate { background: linear-gradient(145deg,#7d96a0,#3f5a66); }
  .av.grey { background: linear-gradient(145deg,#aab5ae,#7d8a82); }
  .agroup .av:hover, .av.owner:hover { transform: translateY(-3px); z-index: 4; }
  .av[data-name]:hover::after {
    content: attr(data-name); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    white-space: nowrap; font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: var(--ink-2); color: #fff;
    pointer-events: none; z-index: 10;
  }
  .av.lg { width: 26px; height: 26px; font-size: 11px; }

  /* ================= sheet ================= */
  .sheet-back { position: absolute; inset: 0; z-index: 20; background: rgba(20,35,28,.34); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet-back.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 84%; display: flex; flex-direction: column;
    background: linear-gradient(#fbfcfb, var(--paper) 120px); border-radius: 22px 22px 0 0;
    box-shadow: 0 -12px 40px rgba(20,40,30,.25), inset 0 1px 0 #fff;
    transform: translateY(104%); transition: transform .34s var(--ease-drawer);
  }
  .sheet.open { transform: translateY(0); }
  .sheet.tall { height: 90%; max-height: 90%; }
  .sheet .grip { width: 36px; height: 4px; border-radius: 2px; background: #cfdbd4; margin: 9px auto 3px; flex-shrink: 0; }
  .snav { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; flex-shrink: 0; }
  .snav[hidden] { display: none; }
  .snav .snav-back { width: 30px; height: 30px; border-radius: 15px; font-size: 17px; color: var(--ink-2); background: #eef2ef; }
  .snav .snav-title { font-size: 14px; font-weight: 650; color: var(--ink-2); }
  .snav .snav-meta { margin-left: auto; font-size: 11px; color: var(--muted); }
  .sbody { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; position: relative; }
  .sbody::-webkit-scrollbar { display: none; }
  .sheet.tall .sbody { overflow: hidden; }
  .spage { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); transition: transform .3s var(--ease-drawer), opacity .2s; }
  .spage.scrolly { overflow-y: auto; scrollbar-width: none; display: block; }
  .spage.scrolly::-webkit-scrollbar { display: none; }
  .spage.in { transform: translateX(100%); }
  .spage.behind { transform: translateX(-18%); opacity: .6; pointer-events: none; }

  /* task drawer */
  .dr { padding: 4px 18px 0; }
  .dr-title { font-size: 18px; font-weight: 700; color: var(--ink-2); line-height: 1.35; }
  .dr-when { margin-top: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dr-owner { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .dr-owner b { color: var(--ink-2); font-weight: 650; }
  .dr-owner > span:not(.dr-state):not(.av) { flex: 1; min-width: 0; }
  .dr-state { margin-left: auto; flex-shrink: 0; white-space: nowrap; font-size: 11px; font-weight: 650; padding: 4px 9px; border-radius: 10px; background: #eef1ef; color: var(--muted); }
  .dr-state.running { background: var(--jade-soft); color: var(--jade-deep); }
  .dr-state.partial, .dr-state.failed { background: var(--brass-soft); color: var(--brass); }
  .dr-state.done { background: #edf3ef; color: #3f7a63; }
  .dr-sum {
    margin-top: 14px; padding: 11px 13px; border-radius: 12px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2);
    background: linear-gradient(#fff,#f9fbf9); box-shadow: inset 0 0 0 .5px rgba(26,55,43,.12), inset 0 1px 0 #fff;
  }
  .dr-sum.warn { background: linear-gradient(#fffaf1,#fbf4e7); box-shadow: inset 0 0 0 .5px rgba(166,106,19,.22); }
  .kicker { font-size: 10.5px; letter-spacing: .14em; color: var(--muted); font-weight: 700; margin: 18px 0 8px; }
  .phases { position: relative; }
  .ph { position: relative; display: flex; gap: 12px; padding-bottom: 14px; }
  .ph:not(:last-child)::before { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 2px; border-radius: 1px; background: #d3ddd6; }
  .ph.span:not(:last-child)::before {
    width: 5px; left: 6px;
    background: linear-gradient(#1a6f52 0 var(--p, 0%), #c3dccd var(--p, 0%) 100%);
  }
  .pn { position: relative; z-index: 1; flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; border-radius: 50%; background: #fff; }
  .pn::after { content: ""; position: absolute; border-radius: 50%; }
  .pn.start::after { inset: 2.5px; background: #a6c9b3; }
  .pn.start.done::after { background: var(--jade); }
  .pn.end::after { inset: 2.5px; border: 2px solid #98b9a5; background: #fff; }
  .pn.end.done::after { border-color: var(--jade); }
  .pn.point::after { inset: 3.5px; border: 1.6px solid #87998e; background: #fff; }
  .pn.point.done::after { background: #83958a; border-color: #83958a; }
  .pm { flex: 1; min-width: 0; }
  .pt { display: flex; align-items: baseline; gap: 7px; font-size: 11.5px; color: var(--muted); }
  .pt b { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .pt .pres { margin-left: auto; font-size: 11px; font-weight: 600; }
  .pres.ok { color: var(--jade); } .pres.warn { color: var(--brass); } .pres.wait { color: var(--muted-2); font-weight: 500; }
  .ptarget { margin-top: 3px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .pdevs {
    width: 100%; margin-top: 8px; display: flex; align-items: center; gap: 9px; padding: 7px 10px 7px 12px; border-radius: 11px; text-align: left;
    background: linear-gradient(#fff,#f9fbf9); box-shadow: inset 0 0 0 .5px rgba(26,55,43,.12), inset 0 1px 0 #fff;
  }
  .pdevs .pcount { flex: 1; font-size: 11px; color: var(--muted); }
  .pdevs .chev { color: var(--muted-2); transition: transform .2s var(--ease-out); }
  .pdevs.open .chev { transform: rotate(90deg); }
  .plist { margin-top: 6px; border-radius: 11px; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 .5px rgba(26,55,43,.1); }
  .plist[hidden] { display: none; }
  .prow { display: flex; align-items: center; gap: 9px; padding: 7px 10px; font-size: 12px; }
  .prow + .prow { border-top: .5px solid #e7ebe7; }
  .prow .pname { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .ptg { color: var(--muted); font-size: 11px; }
  .rep-row { display: flex; gap: 10px; font-size: 12px; color: var(--muted); padding: 5px 0; line-height: 1.55; }
  .rep-row .rk { color: var(--ink-2); font-weight: 600; flex-shrink: 0; width: 60px; }
  .dr-dock {
    position: sticky; bottom: 0; display: flex; gap: 8px; padding: 14px 18px 20px; margin-top: 10px;
    background: linear-gradient(rgba(244,247,245,0), var(--paper) 36%);
  }
  .dr-dock .btn { flex: 1; height: 42px; border-radius: 12px; font-size: 13px; font-weight: 650; }
  .btn.primary { background: linear-gradient(145deg,#308b70,var(--jade-deep)); color: #fff; box-shadow: 0 6px 14px -6px rgba(17,85,63,.5); }
  .btn.quiet { background: #fff; color: var(--jade-deep); box-shadow: inset 0 0 0 1px rgba(23,107,84,.25); }
  .btn.ghost { background: #eef1ef; color: #6b5a3c; }
  .btn:active { transform: scale(.97); }
  /* matrix drawer */
  .mx { border-radius: 12px; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 .5px rgba(26,55,43,.12); }
  .mx-row { display: grid; align-items: center; gap: 6px; padding: 7px 10px; font-size: 11.5px; }
  .mx-row + .mx-row { border-top: .5px solid #e7ebe7; }
  .mx-h { background: #f6f8f6; font-size: 10.5px; color: var(--muted); font-weight: 650; }
  .mx-h span small { display: block; font-weight: 500; font-size: 9.5px; color: var(--muted-2); }
  .mx-dev { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .mx-dev em { font-style: normal; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 7px; font-size: 10.5px; background: #f1f4f2; color: var(--muted); white-space: nowrap; }
  .cell.ok { background: var(--jade-soft); color: var(--jade-deep); }
  .cell.noop { background: #eef2ef; color: #5f6e66; }
  .cell.fail { background: var(--brass-soft); color: var(--brass); }
  .cell.none { background: none; color: #c3cdc6; }
  .cell i { font-style: normal; font-weight: 700; }

  /* ================= device list ================= */
  .dfilter { position: relative; flex-shrink: 0; height: 50px; border-bottom: 1px solid #e3e8e4; }
  .dfilter .controls, .dfilter .search-controls {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    transition: transform 260ms var(--ease-drawer), opacity 170ms ease-out;
  }
  .dfilter .search-controls { opacity: 0; transform: translateX(22px); pointer-events: none; }
  .dfilter.searching .controls { opacity: 0; transform: translateX(-22px); pointer-events: none; }
  .dfilter.searching .search-controls { opacity: 1; transform: none; pointer-events: auto; }
  .fchip { height: 32px; padding: 0 14px; border-radius: 16px; background: #eff2ee; color: #45564d; font-size: 12px; transition: transform 130ms var(--ease-out); }
  .fchip:active { transform: scale(.95); }
  .fchip.on { background: var(--jade); color: #fff; }
  .round { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #f4f7f5; box-shadow: inset 0 0 0 1px #d8e1dc; flex-shrink: 0; }
  .round img { width: 14px; height: 14px; }
  .dfilter .count { margin-left: auto; font-size: 11px; color: var(--muted); }
  .search-field { flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 13px; border-radius: 18px; background: #f4f7f5; box-shadow: inset 0 0 0 1px #d8e1dc; transform-origin: right center; transform: scaleX(.16); transition: transform 260ms var(--ease-drawer); }
  .dfilter.searching .search-field { transform: scaleX(1); }
  .search-field img { width: 14px; height: 14px; opacity: .7; }
  .search-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 13px; color: var(--ink-2); }
  .dscroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .dscroll::-webkit-scrollbar { display: none; }
  .dlist { padding: 4px 16px 80px; }
  .dgroup-t { font-size: 11px; font-weight: 650; color: #5f6e66; letter-spacing: .4px; margin: 14px 2px 8px; }
  .dempty { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
  mark { background: #f6dda480; box-shadow: 0 0 0 1px #dca93a24; color: inherit; border-radius: 2px; }
  /* L1 陈列格 */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dtile {
    position: relative; display: flex; flex-direction: column; text-align: left; border-radius: 10px; overflow: hidden;
    background: #f2f5f1; box-shadow: inset 0 0 0 1px #1a372b24, 0 9px 14px -12px #1e352b66; transition: transform 140ms var(--ease-out);
  }
  .dtile:active { transform: scale(.98); }
  .plinth { position: relative; height: 70px; overflow: hidden; background: linear-gradient(155deg,#d9ded9,#f4f3ed 48%,#cbd2cd); }
  .plinth::before { content: ""; position: absolute; inset: 4px; border: 1px solid #ffffff94; border-radius: 4px; }
  .plinth img { position: absolute; inset: 4%; width: 92%; height: 92%; object-fit: contain; }
  .plinth .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #8b9a91; }
  .lamp { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: radial-gradient(circle at 35% 30%, #fff 0 12%, #bcc6c0 45%, #8f9c95); box-shadow: 0 0 0 1.5px rgba(255,255,255,.85), 0 1px 1px rgba(0,0,0,.2); }
  .lamp.on { background: radial-gradient(circle at 35% 30%, #fff8e4 0 15%, #f0b94a 45%, #b57a17); box-shadow: 0 0 0 1.5px rgba(255,255,255,.85), 0 0 6px rgba(240,185,74,.65); }
  .lamp.offline { background: #fff; box-shadow: inset 0 0 0 1.5px #b57932, 0 0 0 1.5px rgba(255,255,255,.85); }
  .plinth .lamp { position: absolute; top: 9px; right: 9px; }
  .dt-copy { padding: 7px 9px 9px; }
  .dt-name { display: block; font-size: 12px; font-weight: 650; color: #17251f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dt-loc { display: block; margin-top: 2px; font-size: 10px; color: #5f6e66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dt-next { display: flex; gap: 4px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #1d3a2d1f; font-size: 9.5px; color: var(--jade); white-space: nowrap; overflow: hidden; }
  .dt-next.idle { color: #a3aea7; }
  .dt-next b { font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .dt-next .ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .dtile.offline .dt-loc { color: var(--brass); }
  /* L2 铭牌行 */
  .plates { border-radius: 14px; overflow: hidden; background: linear-gradient(#fff,#fbfcfa); box-shadow: inset 0 0 0 .5px rgba(26,55,43,.10), inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(28,57,42,.06), 0 8px 20px rgba(28,57,42,.05); }
  .drow { position: relative; width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 10px; text-align: left; }
  .drow + .drow::before { content: ""; position: absolute; left: 60px; right: 0; top: 0; height: .5px; background: #e7ebe7; }
  .drow:active { background: #f5f8f6; }
  .thumb { position: relative; width: 42px; height: 32px; flex-shrink: 0; border-radius: 7px; overflow: hidden; background: linear-gradient(155deg,#dfe3de,#f5f4ef 50%,#d3d9d4); box-shadow: inset 0 0 0 .5px rgba(26,55,43,.14); }
  .thumb img { position: absolute; inset: 3%; width: 94%; height: 94%; object-fit: contain; }
  .thumb .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #8b9a91; }
  .dr-main { flex: 1; min-width: 0; }
  .dr-name { display: block; font-size: 13px; color: #263a30; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dr-sub { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 10.5px; color: #67736b; white-space: nowrap; overflow: hidden; }
  .dr-sub .lamp { width: 6px; height: 6px; }
  .dr-next { flex-shrink: 0; text-align: right; font-size: 10px; color: var(--muted-2); line-height: 1.35; }
  .dr-next b { display: block; color: var(--jade); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .drow .chev { color: var(--muted-2); }

  /* device detail */
  .dview { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .dhero { flex-shrink: 0; display: flex; gap: 12px; align-items: center; padding: 12px 16px 10px; }
  .dhero .plinth { width: 92px; height: 66px; border-radius: 10px; flex-shrink: 0; box-shadow: inset 0 0 0 1px #1a372b24, 0 9px 14px -12px #1e352b66; }
  .dhero .hn { font-size: 16px; font-weight: 700; color: var(--ink-2); }
  .dhero .hm { margin-top: 2px; font-size: 11px; color: var(--muted); }
  .dhero .hs { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .dnext { flex-shrink: 0; margin: 0 16px 6px; padding: 8px 11px; border-radius: 10px; font-size: 11.5px; color: var(--muted); background: linear-gradient(#fff,#f8faf8); box-shadow: inset 0 0 0 .5px rgba(26,55,43,.12); display: flex; gap: 6px; }
  .dnext b { color: var(--jade-deep); font-weight: 650; }
  .dnote { flex-shrink: 0; font-size: 10px; color: var(--muted-2); text-align: center; padding: 2px 0 6px; }
  .tlhost { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  /* DT2 履历 */
  .log { flex: 1; overflow-y: auto; padding: 4px 14px 80px 0; scrollbar-width: none; }
  .log::-webkit-scrollbar { display: none; }
  .lg-day { margin: 12px 0 6px 84px; font-size: 10px; font-weight: 650; letter-spacing: .12em; color: #a9b6ae; }
  .lg-row { position: relative; display: flex; align-items: center; min-height: 42px; }
  .lg-row::before { content: ""; position: absolute; left: 55px; top: 0; bottom: 0; width: 1.6px; background: #b9c8be; }
  .lg-row.past::before { background: #81958a; }
  .lg-t { width: 44px; text-align: right; font-size: 10.5px; color: #45564d; font-weight: 620; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .lg-t small { display: block; font-size: 9px; color: var(--muted-2); font-weight: 500; }
  .lg-n { position: relative; z-index: 1; width: 14px; height: 14px; margin: 0 16px 0 5px; border-radius: 50%; background: #fff; flex-shrink: 0; }
  .lg-n::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1.6px solid #87998e; background: #fff; }
  .lg-row.past .lg-n::after { background: #83958a; border-color: #83958a; }
  .lg-n.span::after { border-color: var(--jade); background: var(--jade); inset: 2px; }
  .lg-card { flex: 1; min-width: 0; position: relative; height: 32px; }
  .lg-card .tcard { position: absolute; left: 0; right: 0; top: 0; }
  .lg-now { display: flex; align-items: center; gap: 6px; margin: 4px 0 4px 38px; font-size: 10px; color: #99651b; font-weight: 700; }
  .lg-now i { width: 12px; height: 12px; border-radius: 50%; background: #ad711b; box-shadow: 0 0 0 2.5px #fff; }
  .lg-now::after { content: ""; flex: 1; height: 1px; background: repeating-linear-gradient(90deg,#b9862b 0 4px,transparent 4px 9px); opacity: .6; }

  /* P3 shelf */
  .shelf { flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px 10px; scrollbar-width: none; border-bottom: 1px solid #e3e8e4; background: linear-gradient(#f7f9f7,#eef2ef); box-shadow: inset 0 -6px 10px -8px rgba(28,57,42,.14); }
  .shelf::-webkit-scrollbar { display: none; }
  .stile { position: relative; flex-shrink: 0; width: 64px; display: flex; flex-direction: column; align-items: stretch; border-radius: 9px; overflow: hidden; background: #f2f5f1; box-shadow: inset 0 0 0 1px #1a372b24, 0 7px 10px -9px #1e352b80; transition: transform 140ms var(--ease-out), box-shadow .2s; }
  .stile:active { transform: scale(.96); }
  .stile .plinth { height: 42px; }
  .stile .plinth .lamp { top: 6px; right: 6px; width: 6px; height: 6px; }
  .stile span.sn { display: block; padding: 4px 4px 5px; font-size: 9.5px; color: #33463c; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .stile.on { box-shadow: inset 0 0 0 1.5px var(--jade), 0 7px 12px -8px rgba(23,107,84,.6); }
  .stile.all, .stile.more { justify-content: center; align-items: center; height: 63px; font-size: 12px; font-weight: 650; color: var(--ink-2); background: linear-gradient(#fff,#f1f5f2); }
  .stile.all small, .stile.more small { display: block; font-size: 9.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .focusbar { flex-shrink: 0; display: flex; align-items: center; gap: 8px; margin: 8px 14px 0; padding: 6px 6px 6px 8px; border-radius: 12px; font-size: 12px; color: var(--muted); background: linear-gradient(#fff,#f7faf8); box-shadow: inset 0 0 0 .5px rgba(26,55,43,.14); }
  .focusbar b { color: var(--ink-2); }
  .focusbar .x { margin-left: auto; width: 26px; height: 26px; border-radius: 13px; background: #eef2ef; color: var(--muted); }

  /* region sheet */
  .rsheet { padding: 2px 16px 22px; }
  .rs-title { font-size: 17px; font-weight: 700; color: var(--ink-2); }
  .rs-sub { margin-top: 4px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .rs-list { margin-top: 12px; border-radius: 14px; overflow: hidden; background: linear-gradient(#fff,#fbfcfa); box-shadow: inset 0 0 0 .5px rgba(26,55,43,.12), 0 8px 20px rgba(28,57,42,.05); }
  .rs-row { position: relative; width: 100%; display: flex; align-items: center; gap: 11px; padding: 12px 14px; text-align: left; }
  .rs-row + .rs-row::before { content: ""; position: absolute; left: 42px; right: 0; top: 0; height: .5px; background: #e7ebe7; }
  .radio { width: 17px; height: 17px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1.5px #b9c6be; background: #fff; }
  .rs-row.on .radio { box-shadow: inset 0 0 0 5px var(--jade); }
  .rs-main { flex: 1; min-width: 0; }
  .rs-name { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .rs-meta { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted); }
  .rs-hint { flex-shrink: 0; display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; }
  .h-alert { color: var(--brass); } .h-alert::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #b57932; margin-right: 5px; vertical-align: 1px; }
  .h-live { color: var(--jade-deep); } .h-live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--jade); margin-right: 5px; vertical-align: 1px; box-shadow: 0 0 0 2px var(--jade-soft); }

  return `<span class="av owner ${tone}${lg ? ' lg' : ''}" data-name="${by === ME ? '我创建' : by + ' 创建'}">${by === ME ? '我' : ch}</span>`;
}
const plinth = d => `<span class="plinth">${d.art ? `<img src="${ART[d.art]}" alt="">` : `<span class="glyph">${d.glyph}</span>`}<i class="lamp ${d.st}"></i></span>`;

/* ================= B6 timeline component =================
   几何逐项移植自 proto-region-panel.html 的 B6 分支：railX（中心 55.5 / 振幅 8.5 / 波长 221，峰值锚定今天 10:30）、
   34px/h、跨日连续、单侧缎带同路径裁切、刻痕避让、节点角色与叠绘顺序。仅把数据源和卡片内容参数化。 */
const HOUR_PX = 34, TOP_PAD = 44, CARD_HALF = 16;
const RAIL_CENTER_X = 55.5, RAIL_AMPLITUDE = 8.5, RAIL_WAVELENGTH = 221;
const timelines = new Set();
let tlSeq = 0;

function calHtml(focus, open, marks, compact) {
  const fd = d2(focus);
  const cell = (d, other) => {
    const ds = fmtDs(d);
    return `<div class="cal-d${other ? ' other' : ''}${ds === TODAY ? ' today' : ''}${ds === focus ? ' sel' : ''}" data-d="${ds}"><span class="wd">${WD[d.getDay()]}</span>${d.getDate()}${marks.has(ds) ? '<span class="has"></span>' : ''}</div>`;
  };
  let cells = '';
  if (!open || compact) {
    const mon = new Date(fd); mon.setDate(fd.getDate() - ((fd.getDay() + 6) % 7));
    for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); cells += cell(d); }
  } else {
    const y = fd.getFullYear(), m = fd.getMonth(), lead = (new Date(y, m, 1).getDay() + 6) % 7, start = new Date(y, m, 1 - lead);
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      cells += cell(d, d.getMonth() !== m);
      if (d.getDay() === 0 && d.getMonth() !== m && i > 27) break;
    }
  }
  const head = compact
    ? `<div class="cal-cap"><b>${fd.getMonth() + 1} 月 · 本设备</b><span>点日期跳转</span></div>`
    : `<div class="cal-head"><span class="cm">${fd.getFullYear()} 年 ${fd.getMonth() + 1} 月</span><span class="ct">${open ? '收起 ▴' : '展开 ▾'}</span></div>`;
  return `${head}<div class="cal-grid">${cells}</div>${compact ? '' : '<div class="cal-grip"></div>'}`;
}

function mountTimeline(root, cfg) {
  const uid = 'tl' + (++tlSeq);
  const first = cfg.items();
  if (!first.length) {
    root.innerHTML = `<div class="tl-empty">${cfg.empty || ''}</div>`;
    return null;
  }
  const dates = [...first.map(i => i.date), TODAY].sort();
  const days = [];
  for (let d = dates[0]; d <= dates[dates.length - 1]; d = addDays(d, 1)) days.push(d);
  const dayIdx = Object.fromEntries(days.map((d, i) => [d, i]));
  const yOf = (d, t) => TOP_PAD + dayIdx[d] * 24 * HOUR_PX + minOf(t) / 60 * HOUR_PX;
  const total = TOP_PAD + days.length * 24 * HOUR_PX + TOP_PAD;
  const peakY = yOf(TODAY, '10:30');
  const railX = y => RAIL_CENTER_X + RAIL_AMPLITUDE * Math.cos(2 * Math.PI * (y - peakY) / RAIL_WAVELENGTH);
  const marks = new Set(first.map(i => i.date));
  let focus = dayIdx[cfg.focusDate] !== undefined ? cfg.focusDate : TODAY;
  let calOpen = false, calShown = cfg.calendar === 'strip', firstRender = true;

  root.classList.add('tl');
  root.innerHTML = `<div class="cal${cfg.calendar === 'pill' ? ' compact' : ''}"${calShown ? '' : ' hidden'}></div>
    <div class="tlscroll"><div class="tlwrap"></div></div>
    <button class="datefloat${cfg.calendar === 'pill' ? ' interactive' : ''}" type="button"${cfg.calendar === 'strip' ? ' hidden' : ''}>${dateLabel(focus)}</button>`;
  const calEl = root.querySelector('.cal'), scroll = root.querySelector('.tlscroll');
  const wrap = root.querySelector('.tlwrap'), dfl = root.querySelector('.datefloat');

  function renderCal() {
    if (!calShown) return;
    calEl.innerHTML = calHtml(focus, calOpen, marks, cfg.calendar === 'pill');
    calEl.querySelector('.cal-head')?.addEventListener('click', () => { calOpen = !calOpen; renderCal(); });
    calEl.querySelectorAll('.cal-d').forEach(c => c.onclick = () => pickDate(c.dataset.d));
  }
  function pickDate(ds) {
    focus = ds; renderCal(); cfg.onFocus?.(ds);
    if (dayIdx[ds] === undefined) { toast('这一天没有记录'); return; }
    scroll.scrollTo({ top: ds === TODAY ? Math.max(0, yOf(TODAY, clockText(S.now)) - 200) : yOf(ds, '00:00') - 8, behavior: 'smooth' });
  }
  if (cfg.calendar === 'pill') dfl.onclick = () => {
    calShown = !calShown; calEl.hidden = !calShown; root.classList.toggle('cal-open', calShown); renderCal();
  };
  scroll.addEventListener('scroll', () => {
    const sc = scroll.scrollTop; let cur = days[0];
    days.forEach(d => { if (yOf(d, '00:00') - 60 <= sc) cur = d; });
    const lbl = dateLabel(cur);
    if (dfl.textContent !== lbl) dfl.textContent = lbl;
    if (cur !== focus) { focus = cur; renderCal(); cfg.onFocus?.(cur); }
  }, { passive: true });

  function render() {
    const items = cfg.items();
    const nowY = yOf(TODAY, clockText(S.now));
    const intervals = items.filter(i => i.e).sort((a, b) => yOf(a.date, a.s) - yOf(b.date, b.s));
    const laneEnds = [-Infinity, -Infinity], drawn = [];
    intervals.forEach(t => {
      const y1 = yOf(t.date, t.s), y2 = yOf(t.date, t.e), lane = laneEnds.findIndex(end => end <= y1);
      if (lane < 0) return;
      laneEnds[lane] = y2; drawn.push({ t, y1, y2, lane });
    });
    const overlap = drawn.some(x => x.lane > 0);
    wrap.style.height = total + 'px';
    wrap.classList.toggle('overlap', overlap);

    const anchors = items.flatMap(i => [yOf(i.date, i.s || i.at), ...(i.e ? [yOf(i.date, i.e)] : [])]);
    anchors.push(nowY);
    const ticks = [];
    days.forEach(d => {
      for (let h = 0; h < 24; h += 3) {
        const y = yOf(d, clockText(h * 60));
        if (intervals.some(t => t.date === d && y >= yOf(d, t.s) && y <= yOf(d, t.e))) continue;
        if (anchors.some(a => Math.abs(a - y) < 14)) continue;
        ticks.push({ y, h, d });
      }
    });
    const labels = [];
    items.forEach(i => {
      labels.push({ y: yOf(i.date, i.s || i.at), html: i.s || i.at, cls: 'event', pri: 2 });
      if (i.e) labels.push({ y: yOf(i.date, i.e), html: i.e, cls: 'event', pri: 2 });
    });
    ticks.forEach(({ y, h, d }) => {
      const past = d < TODAY || (d === TODAY && h * 60 < S.now);
      labels.push({ y, html: `${pad(h)}:00`, cls: 'tick' + (past ? ' past' : ''), pri: 1 });
    });
    const exact = labels.filter(l => l.pri > 1).map(l => l.y);
    const placed = labels.filter((l, i) =>
      (l.pri > 1 || exact.every(y => Math.abs(y - l.y) >= 18))
      && (l.pri === 1 || labels.findIndex(o => o.pri === l.pri && o.y === l.y) === i))
      .sort((a, b) => a.y - b.y).map(l => ({ ...l, displayY: l.y, height: 14 }));
    for (let pass = 0; pass < 3; pass++) for (let i = 1; i < placed.length; i++) {
      const a = placed[i - 1], b = placed[i], ov = (a.height + b.height) / 2 + 4 - (b.displayY - a.displayY);
      if (ov > 0) { a.displayY -= ov / 2; b.displayY += ov / 2; }
    }
    let html = placed.map(l => `<span class="glab ${l.cls}${Math.abs(l.displayY - l.y) > 2 ? ' shifted' : ''}"
      data-anchor-y="${l.y}" data-label-y="${l.displayY}" style="top:${l.displayY}px">${l.html}</span>`).join('');
    html += `<span class="glab now" style="top:${nowY}px;visibility:hidden"><span class="caption">现在</span><span class="clock">${clockText(S.now)}</span></span>`;
    days.forEach(d => { html += `<div class="daytick" style="top:${yOf(d, '00:00')}px">${dateLabel(d)}</div>`; });
    items.forEach(i => {
      const y = yOf(i.date, i.s || i.at);
      html += `<div class="tcard ${i.cls || ''}${firstRender ? ' enter' : ''}" data-id="${i.id}" data-y="${y}" style="top:${y}px">${i.html}</div>`;
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('.tcard').forEach(c => c.onclick = () => items.find(i => i.id === c.dataset.id)?.onClick?.());
    firstRender = false;

    /* now label: 与任何时刻文字相撞则整组隐藏，节点保留 */
    const nowLabel = wrap.querySelector('.glab.now'), nr = nowLabel.getBoundingClientRect();
    const hit = [...wrap.querySelectorAll('.glab:not(.now)')].some(l => { const r = l.getBoundingClientRect(); return nr.top < r.bottom + 3 && nr.bottom > r.top - 3; });
    nowLabel.style.visibility = hit ? 'hidden' : 'visible';

    const cards = [...wrap.querySelectorAll('.tcard')].sort((a, b) => a.dataset.y - b.dataset.y);
    let prev = -1;
    cards.forEach(c => { const top = Math.max(+c.dataset.y - CARD_HALF, prev); c.style.top = top + 'px'; prev = top + c.offsetHeight + 8; });

    const W = wrap.clientWidth || 340;
    const railPath = (y1, y2, step = 2) => {
      let p = `M ${railX(y1).toFixed(1)} ${y1}`;
      for (let y = y1 + step; y <= y2; y += step) p += ` L ${railX(y).toFixed(1)} ${y}`;
      if (y2 - y1 > 0 && (y2 - y1) % step) p += ` L ${railX(y2).toFixed(1)} ${y2}`;
      return p;
    };
    const ribbonPoint = (y, y1, y2, lane = 0) => {
      const slope = (railX(y + 1) - railX(y - 1)) / 2, nx = 1 / Math.hypot(1, slope), ny = -slope * nx;
      const u = (y - y1) / (y2 - y1), width = 1.5 + 9.5 * Math.pow(Math.sin(Math.PI * u), 1.4), offset = lane * 18 * nx;
      return { left: [railX(y) + offset, y], right: [railX(y) + offset + width * nx, y + width * ny] };
    };
    const ribbonPath = (y1, y2, lane = 0) => {
      const pts = [];
      for (let y = y1; y < y2; y += 2) pts.push(ribbonPoint(y, y1, y2, lane));
      pts.push(ribbonPoint(y2, y1, y2, lane));
      const pair = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
      return `M ${pair(pts[0].left)} ` + pts.slice(1).map(p => `L ${pair(p.left)}`).join(' ')
        + ' ' + pts.reverse().map(p => `L ${pair(p.right)}`).join(' ') + ' Z';
    };
    let svg = `<svg class="rail" width="${W}" height="${total}" viewBox="0 0 ${W} ${total}"><defs>
      <linearGradient id="${uid}F" gradientUnits="userSpaceOnUse" x1="46" x2="74"><stop stop-color="#b4d3c1"/><stop offset="1" stop-color="#d9e9dd"/></linearGradient>
      <linearGradient id="${uid}E" gradientUnits="userSpaceOnUse" x1="46" x2="74"><stop stop-color="#126448"/><stop offset="1" stop-color="#258767"/></linearGradient>
      <clipPath id="${uid}C"><rect width="${W}" height="${nowY}"/></clipPath></defs>`;
    const d = railPath(0, total);
    svg += `<path d="${d}" fill="none" stroke="#b9c8be" stroke-width="1.6"/>`;
    svg += `<path d="${d}" fill="none" stroke="#81958a" stroke-width="1.6" clip-path="url(#${uid}C)"/>`;
    ticks.forEach(({ y }) => {
      const x = railX(y), fill = y < nowY ? '#a5bbae' : '#bfcec4';
      svg += `<rect x="${(x - 5).toFixed(1)}" y="${(y - 3.2).toFixed(1)}" width="10" height="6.4" rx="3.2" fill="#fff"/>`;
      svg += `<rect x="${(x - 3.2).toFixed(1)}" y="${(y - 1.7).toFixed(1)}" width="6.4" height="3.4" rx="1.7" fill="${fill}"/>`;
    });
    wrap.querySelectorAll('.glab.shifted').forEach(l => {
      const ay = +l.dataset.anchorY, ly = +l.dataset.labelY;
      svg += `<path d="M 38 ${ly.toFixed(1)} L ${(railX(ay) - 8).toFixed(1)} ${ay}" fill="none" stroke="#a9b9ae" stroke-width=".9" stroke-linecap="round"/>`;
    });
    const nodeAt = {}, endAt = {}, leadAt = {};
    items.forEach(i => {
      if (!i.e) { const y = yOf(i.date, i.at); nodeAt[i.id] = leadAt[i.id] = { x: railX(y), y }; return; }
      const y1 = yOf(i.date, i.s), y2 = yOf(i.date, i.e), ym = (y1 + y2) / 2;
      nodeAt[i.id] = { x: railX(y1), y: y1 }; endAt[i.id] = { x: railX(y2), y: y2 }; leadAt[i.id] = { x: railX(ym), y: ym };
    });
    drawn.forEach(({ t, y1, y2, lane }) => {
      const shape = ribbonPath(y1, y2, lane);
      svg += `<path class="interval-shape future" d="${shape}" fill="url(#${uid}F)"/>`;
      if (nowY > y1) svg += `<path class="interval-shape elapsed" d="${shape}" fill="url(#${uid}E)"${nowY < y2 ? ` clip-path="url(#${uid}C)"` : ''}/>`;
      if (lane) [y1, y2].forEach(y => {
        const x = ribbonPoint(y, y1, y2, lane).left[0];
        svg += `<path d="M ${railX(y)} ${y} H ${x.toFixed(1)}" fill="none" stroke="#f4f7f5" stroke-width="3.5" stroke-linecap="round"/>`;
        svg += `<path d="M ${railX(y)} ${y} H ${x.toFixed(1)}" fill="none" stroke="#7aa28b" stroke-width="1.2" stroke-linecap="round"/>`;
      });
      nodeAt[t.id] = { x: ribbonPoint(y1, y1, y2, lane).left[0], y: y1 };
      endAt[t.id] = { x: ribbonPoint(y2, y1, y2, lane).left[0], y: y2 };
    });
    const x2 = overlap ? 110 : 82;
    items.forEach(i => {
      const card = wrap.querySelector(`.tcard[data-id="${i.id}"]`), n = leadAt[i.id];
      if (!card || !n) return;
      const cy = card.offsetTop + Math.min(26, card.offsetHeight / 2), x1 = Math.min(n.x + (i.e ? 13 : 5), x2 - 4);
      svg += `<path d="M ${x1} ${n.y} C ${x1 + 12} ${n.y}, ${x2 - 12} ${cy}, ${x2} ${cy}" fill="none" stroke="${i.faded ? '#dde4df' : '#c3cfc8'}" stroke-width="1"/>`;
    });
    const active = drawn.filter(x => x.y1 <= nowY && nowY < x.y2);
    const lineStart = Math.max(railX(nowY) + 9, ...active.map(x => ribbonPoint(nowY, x.y1, x.y2, x.lane).right[0] + 4));
    svg += `<path d="M ${lineStart} ${nowY} H ${W - 14}" fill="none" stroke="#b9862b" stroke-width="1" stroke-dasharray="4 5" opacity=".68"/>`;
    const disk = (x, y, o, r, fill) => `<circle cx="${x.toFixed(1)}" cy="${y}" r="${o}" fill="#fff"/><circle cx="${x.toFixed(1)}" cy="${y}" r="${r}" fill="${fill}"/>`;
    const ring = (x, y, c) => `<circle cx="${x.toFixed(1)}" cy="${y}" r="7" fill="#fff"/><circle cx="${x.toFixed(1)}" cy="${y}" r="5.1" fill="#fff" stroke="${c}" stroke-width="2"/>`;
    const pointRing = (x, y) => `<circle cx="${x.toFixed(1)}" cy="${y}" r="5.8" fill="#fff"/><circle cx="${x.toFixed(1)}" cy="${y}" r="3.9" fill="#fff" stroke="#87998e" stroke-width="1.6"/>`;
    const starts = new Set(drawn.map(x => x.y1));
    items.filter(i => !i.e).forEach(i => {
      const p = nodeAt[i.id];
      if (starts.has(p.y)) return;
      svg += p.y <= nowY ? disk(p.x, p.y, 5.8, 3.9, '#83958a') : pointRing(p.x, p.y);
    });
    drawn.forEach(({ t, y1, y2 }) => {
      svg += disk(nodeAt[t.id].x, y1, 7.1, 5.2, y1 <= nowY ? '#176b54' : '#a6c9b3');
      svg += ring(endAt[t.id].x, y2, y2 <= nowY ? '#176b54' : '#98b9a5');
    });
    svg += disk(railX(nowY), nowY, 7.5, 5.2, '#ad711b');
    wrap.insertAdjacentHTML('afterbegin', svg + '</svg>');
  }

  const api = {
    root, render,
    alive: () => document.body.contains(root),
    scrollToNow() { scroll.scrollTop = Math.max(0, yOf(TODAY, clockText(S.now)) - 220); },
    scrollToItem(id) {
      const it = cfg.items().find(i => i.id === id);
      if (it) scroll.scrollTo({ top: Math.max(0, yOf(it.date, it.s || it.at) - 160), behavior: 'smooth' });
    },
    pickDate,
  };
  timelines.add(api);
  render(); renderCal();
  if (focus !== TODAY) scroll.scrollTop = yOf(focus, '00:00') - 8; else api.scrollToNow();
  return api;
}

/* ================= card content ================= */
function regionItems(rid) {
  return (TASKS[rid] || []).map(t => {
    const st = taskState(t), warn = st === 'partial' || st === 'failed', past = ['done', 'partial', 'failed'].includes(st);
    return {
      id: t.id, date: t.date, at: t.at, s: t.s, e: t.e, faded: past || st === 'cancelled',
      cls: [past && 'past', warn && 'warn', st === 'running' && 'running', st === 'cancelled' && 'cancelled'].filter(Boolean).join(' '),
      html: `<span class="tn">${warn ? '<i class="flag"></i>' : ''}${t.name}</span>${avatarGroup(uniqueDevs(t), rid)}<span class="tsep"></span>${ownerAv(t.by)}`,
      onClick: () => openTask(t.id),
    };
  });
}
const RES_HTML = { ok: '<span class="rs ok">✓</span>', noop: '<span class="rs noop">已满足</span>', fail: '<span class="rs fail">失败</span>', run: '<span class="rs run">进行中</span>', cancelled: '<span class="rs cx">已取消</span>', pending: '' };
function deviceEvents(rid, devId) {
  const ev = [];
  (TASKS[rid] || []).forEach(t => {
    const mine = t.phases.map(p => ({ p, d: p.devs.find(x => x[0] === devId) })).filter(x => x.d);
    if (!mine.length) return;
    const res = mine.map(x => devResult(t, x.p, x.d));
    const agg = t.cancelled ? 'cancelled' : res.includes('fail') ? 'fail' : res.includes('pending') ? (res.some(r => r !== 'pending') ? 'run' : 'pending') : res.every(r => r === 'noop') ? 'noop' : 'ok';
    const base = { kind: 'task', task: t, by: t.by, res: agg };
    if (t.e && mine.length > 1) ev.push({ ...base, id: `${t.id}-${devId}`, date: t.date, s: t.s, e: t.e, text: `${mine[0].d[1]} → ${mine[mine.length - 1].d[1]}` });
    else mine.forEach((x, i) => ev.push({ ...base, res: t.cancelled ? 'cancelled' : res[i], id: `${t.id}-${devId}-${i}`, date: t.date, at: x.p.at, text: x.d[1] }));
  });
  OPS.filter(o => o.dev === devId).forEach((o, i) => ev.push({ kind: o.src, id: `op-${devId}-${i}`, date: o.date, at: o.at, text: o.text, by: o.by, res: o.res }));
  return ev;
}
const SRC_LABEL = { task: '定时', draft: '即时', human: '人工' };
function opCardHtml(ev) {
  return `<span class="osrc ${ev.kind}">${SRC_LABEL[ev.kind]}</span><span class="tn">${ev.text}${ev.task ? `<em>${ev.task.name}</em>` : ''}</span>${RES_HTML[ev.res] || ''}${ownerAv(ev.by)}`;
}
function deviceItems(rid, devId, onTask) {
  return deviceEvents(rid, devId).map(ev => {
    const end = absMin(ev.date, ev.e || ev.at), past = end <= S.now;
    return {
      id: ev.id, date: ev.date, at: ev.at, s: ev.s, e: ev.e, faded: past || ev.res === 'cancelled',
      cls: [past && 'past', ev.res === 'fail' && 'warn', ev.res === 'run' && 'running', ev.res === 'cancelled' && 'cancelled'].filter(Boolean).join(' '),
      html: opCardHtml(ev),
      onClick: () => ev.task ? onTask(ev.task.id) : toast(ev.kind === 'human' ? '人工操作来自设备审计，只读' : '即时任务：对话中确认后立即执行的单阶段任务'),
    };
  });
}

/* ================= task drawer ================= */
function phaseName(t, i) { return t.phases.length === 1 ? '执行' : t.e && t.phases.length === 2 ? (i === 0 ? '开始' : '结束') : `阶段 ${i + 1}`; }
function phaseCounts(t, p) {
  const c = { ok: 0, noop: 0, fail: 0, pending: 0, cancelled: 0 };
  p.devs.forEach(d => c[devResult(t, p, d)]++);
  return c;
}
function taskSummary(t, rid) {
  const st = taskState(t), n = uniqueDevs(t).length;
  if (st === 'cancelled') return '首个阶段执行前已取消，没有发生任何设备动作。';
  if (st === 'plan') return `将于 ${whenText(t)} 执行 · ${t.phases.length} 个阶段 · ${n} 台设备。到时直接读取设备状态并按需下发，不再调用 Agent。`;
  if (st === 'running') {
    const next = t.phases.find(p => !phaseDone(t, p)), doneN = t.phases.filter(p => phaseDone(t, p)).length;
    return `${doneN} / ${t.phases.length} 个阶段已执行 · 下一阶段 ${next.at} ${next.label}。`;
  }
  const all = t.phases.flatMap(p => p.devs.map(d => [d[0], d[2] || 'ok']));
  const fail = all.filter(x => x[1] === 'fail').map(x => devById(rid, x[0])?.name);
  const noop = all.filter(x => x[1] === 'noop').length;
  if (fail.length) return `${all.length - fail.length} / ${all.length} 项设备目标达成 · ${[...new Set(fail)].join('、')} 未完成（设备离线，无法下发）。`;
  return `全部 ${n} 台设备达到目标${noop ? `，其中 ${noop} 项已满足无需调用` : ''}。`;
}
function drawerActions(t) {
  const st = taskState(t);
  if (t.readonly) return `<button class="btn quiet" onclick="toast('系统模板任务由管理员维护')">查看模板</button>`;
  if (st === 'plan') return `<button class="btn ghost" onclick="toast('删除：任务未开始，直接移除，不产生设备动作')">删除</button><button class="btn primary" onclick="toast('编辑经 Agent skill 完成：首个阶段前可改全部阶段与设备')">编辑</button>`;
  if (st === 'running') return `<button class="btn ghost" onclick="toast('只取消尚未执行的阶段，不回滚已发生的设备动作')">取消剩余阶段</button><button class="btn primary" onclick="toast('任务已开始：只能编辑未来阶段')">编辑未来阶段</button>`;
  return `<button class="btn quiet" onclick="gotoSource('${t.id}')">来源对话</button><button class="btn primary" onclick="rebuild('${t.id}')">再建一次</button>`;
}
function taskDrawerHtml(t, rid) {
  const st = taskState(t), ids = uniqueDevs(t);
  const head = `<div class="dr-title">${t.name}</div>
    <div class="dr-when">${whenText(t)} · ${regionOf(rid).name}</div>
    <div class="dr-owner">${ownerAv(t.by, true)}<span><b>${t.by === ME ? '我' : t.by}</b> 创建 · ${t.created}${t.readonly ? '' : ' · 来自 Agent 对话'}</span><span class="dr-state ${st}">${STATE_TEXT[st]}</span></div>
    <div class="dr-sum${st === 'partial' || st === 'failed' ? ' warn' : ''}">${taskSummary(t, rid)}</div>`;
  let body;
  if (S.drawer === 'D2') {
    const cols = `grid-template-columns: minmax(0,1.5fr) repeat(${t.phases.length}, minmax(0,1fr))`;
    body = `<div class="kicker">设备 × 阶段 · ${ids.length} 台</div><div class="mx">
      <div class="mx-row mx-h" style="${cols}"><span>设备</span>${t.phases.map((p, i) => `<span>${p.at}<small>${phaseName(t, i)}</small></span>`).join('')}</div>
      ${ids.map(id => { const dv = devById(rid, id); return `<div class="mx-row" style="${cols}"><span class="mx-dev">${devAv(dv)}<em>${dv.name}</em></span>${t.phases.map(p => {
        const d = p.devs.find(x => x[0] === id);
        if (!d) return '<span class="cell none">—</span>';
        const r = devResult(t, p, d);
        return `<span class="cell ${r}">${d[1]}<i>${{ ok: ' ✓', noop: ' =', fail: ' ✕' }[r] || ''}</i></span>`;
      }).join('')}</div>`; }).join('')}
    </div>`;
  } else {
    body = `<div class="kicker">阶段 · ${t.phases.length}</div><div class="phases">${t.phases.map((p, i) => {
      const done = phaseDone(t, p) && !t.cancelled, c = phaseCounts(t, p), n = p.devs.length;
      const kind = t.phases.length === 1 ? 'point' : i === 0 ? 'start' : 'end';
      const res = t.cancelled ? ['wait', '已取消'] : !done ? ['wait', '待执行'] : c.fail ? ['warn', `${n - c.fail}/${n} 达成`] : ['ok', c.noop ? `完成 · ${c.noop} 项已满足` : '完成'];
      const next = t.phases[i + 1];
      const span = next ? Math.max(0, Math.min(1, (S.now - absMin(t.date, p.at)) / (absMin(t.date, next.at) - absMin(t.date, p.at)))) : 0;
      return `<div class="ph${t.e ? ' span' : ''}${done ? ' done' : ''}" style="--p:${t.cancelled ? 0 : (span * 100).toFixed(1)}%"><span class="pn ${kind}${done ? ' done' : ''}"></span><div class="pm">
        <div class="pt"><b>${p.at}</b><span>${phaseName(t, i)}</span><span class="pres ${res[0]}">${res[1]}</span></div>
        <div class="ptarget">${p.label}</div>
        <button class="pdevs" onclick="this.classList.toggle('open');this.nextElementSibling.hidden=!this.nextElementSibling.hidden">${avatarGroup(p.devs.map(d => d[0]), rid, 5)}<span class="pcount">${n} 台设备</span><span class="chev">›</span></button>
        <div class="plist" hidden>${p.devs.map(d => { const dv = devById(rid, d[0]); return `<div class="prow">${devAv(dv)}<span class="pname">${dv.name}</span><span class="ptg">${d[1]}</span>${RES_HTML[devResult(t, p, d)] || '<span class="rs noop">待执行</span>'}</div>`; }).join('')}</div>
      </div></div>`;
    }).join('')}</div>`;
  }
  const notes = t.notes ? `<div class="kicker">记录</div>${t.notes.map(r => `<div class="rep-row"><span class="rk">${r[0]}</span><span>${r[1]}</span></div>`).join('')}` : '';
  return `<div class="dr">${head}${body}${notes}</div><div class="dr-dock">${drawerActions(t)}</div>`;
}

/* ================= sheet ================= */
let stack = [];
function openSheet(html, { tall = false } = {}) {
  const sheet = document.getElementById('sheet'), body = document.getElementById('sbody');
  stack = [];
  sheet.classList.toggle('tall', tall);
  document.getElementById('snav').hidden = true;
  body.innerHTML = html; body.scrollTop = 0;
  document.getElementById('sback').classList.add('open');
  sheet.classList.add('open');
}
function openStack(page) {
  openSheet('', { tall: true });
  pushStack(page, false);
}
function pushStack(page, animate = true) {
  const body = document.getElementById('sbody');
  const el = document.createElement('div');
  el.className = 'spage' + (page.scrolly ? ' scrolly' : '') + (animate ? ' in' : '');
  body.appendChild(el);
  stack.push({ ...page, el });
  page.build(el);
  if (animate) requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.remove('in');
    stack[stack.length - 2]?.el.classList.add('behind');
  }));
  syncStackNav();
}
function popStack() {
  if (stack.length < 2) return;
  const top = stack.pop();
  top.el.classList.add('in');
  stack[stack.length - 1].el.classList.remove('behind');
  setTimeout(() => top.el.remove(), 320);
  syncStackNav();
}
function syncStackNav() {
  const top = stack[stack.length - 1];
  document.getElementById('snav').hidden = !top;
  document.querySelector('#snav .snav-back').style.visibility = stack.length > 1 ? 'visible' : 'hidden';
  document.getElementById('snavTitle').textContent = top?.title || '';
  document.getElementById('snavMeta').textContent = top?.meta || '';
}
function closeSheet() {
  document.getElementById('sback').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

function openTask(id) {
  const [t, rid] = findTask(id);
  if (S.variant === 'P2' && stack.length && document.getElementById('sheet').classList.contains('open')) {
    pushStack({ title: '任务', meta: STATE_TEXT[taskState(t)], scrolly: true, build: el => { el.innerHTML = taskDrawerHtml(t, rid); } });
    return;
  }
  openSheet(taskDrawerHtml(t, rid));
}

/* ================= region chip & sheet ================= */
function regionChip() {
  const others = S.hint !== 'none' && REGIONS.some(r => r.id !== S.region && regionStatus(r.id).unseen.length);
  return `<button class="rchip" onclick="openRegions()" aria-label="切换关注区域"><i class="rpin"></i><span class="rname">${regionOf(S.region).name}</span><span class="car">▼</span>${others ? '<i class="rdot"></i>' : ''}</button>`;
}
function regionHint(rid) {
  if (S.hint === 'none') return '';
  const st = regionStatus(rid);
  if (st.unseen.length) return `<span class="h-alert">${st.unseen.length} 项未完成</span>`;
  if (S.hint !== 'all') return '';
  if (st.running) return `<span class="h-live">执行中</span>`;
  if (st.next) return `<span class="h-next">下一项 ${st.next.date === TODAY ? '' : dateLabel(st.next.date).split(' ')[0] + ' '}${st.next.s || st.next.at}</span>`;

}
function openRegions() {

    <div class="rs-list">${REGIONS.map(r => `<button class="rs-row${r.id === S.region ? ' on' : ''}" onclick="setRegion('${r.id}')"><span class="radio"></span><span class="rs-main"><span class="rs-name">${r.name}</span><span class="rs-meta">${r.parent} · ${(DEVICES[r.id] || []).length} 台设备 · ${(TASKS[r.id] || []).length} 项任务</span></span><span class="rs-hint">${regionHint(r.id)}</span></button>`).join('')}</div>
    <div class="rs-foot">${S.session === 'continuous' ? '会话：切换区域不新开会话，对话中插入一条区域分隔；此后提问默认按新区域解释。' : '会话：每个区域各自保留一段会话，切换即换到该区域的对话。'}${S.hint === 'none' ? '' : '<br>提示：打开某区域面板即视为已读，不代表已处置。'}</div></div>`);
}
function setRegion(rid) {

}

/* ================= device list ================= */
function hl(text) {
  const qv = S.list.q.trim();
  if (!qv) return text;
  const i = text.toLowerCase().indexOf(qv.toLowerCase());
  return i < 0 ? text : `${text.slice(0, i)}<mark>${text.slice(i, i + qv.length)}</mark>${text.slice(i + qv.length)}`;
}
function deviceGroups(rid) {
  const qv = S.list.q.trim().toLowerCase();
  const devs = (DEVICES[rid] || []).filter(d => !qv || [d.name, d.loc, KIND[d.kind], d.txt].join(' ').toLowerCase().includes(qv));
  const key = { kind: d => KIND[d.kind], loc: d => d.loc, state: d => ST_LABEL[d.st] }[S.list.mode];
  const groups = [];
  devs.forEach(d => { const k = key(d); let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, items: [] }); g.items.push(d); });
  return groups;
}
function deviceGroupsHtml(rid) {
  const groups = deviceGroups(rid);
  if (!groups.length) return `<div class="dempty">${(DEVICES[rid] || []).length ? '没有匹配的设备' : '这个区域还没有接入设备'}</div>`;
  return groups.map(g => `<div class="dgroup-t">${g.k} · ${g.items.length}</div>${S.dev === 'L2'
    ? `<div class="plates">${g.items.map(d => { const nx = deviceNext(rid, d.id); return `<button class="drow" data-dev="${d.id}"><span class="thumb">${d.art ? `<img src="${ART[d.art]}" alt="">` : `<span class="glyph">${d.glyph}</span>`}</span><span class="dr-main"><span class="dr-name">${hl(d.name)}</span><span class="dr-sub"><i class="lamp ${d.st}"></i>${d.txt} · ${hl(d.loc)}</span></span>${nx ? `<span class="dr-next"><b>${nx.date === TODAY ? '' : '明 '}${nx.at}</b>${nx.target}</span>` : ''}<span class="chev">›</span></button>`; }).join('')}</div>`
    : `<div class="tiles">${g.items.map(d => { const nx = deviceNext(rid, d.id); return `<button class="dtile ${d.st}" data-dev="${d.id}">${plinth(d)}<span class="dt-copy"><span class="dt-name">${hl(d.name)}</span><span class="dt-loc">${hl(d.loc)} · ${d.txt}</span><span class="dt-next${nx ? '' : ' idle'}">${nx ? `<b>${nx.date === TODAY ? '' : '明 '}${nx.at}</b><span class="ell">→ ${nx.target} · ${nx.name}</span>` : '暂无计划任务'}</span></span></button>`; }).join('')}</div>`}`).join('');
}
function renderDeviceList(host, onPick) {

      <div class="search-controls"><button class="round" data-act="back" aria-label="返回全部设备"><img src="../../static/back.svg" alt=""></button><label class="search-field"><img src="../../static/search.svg" alt=""><input placeholder="搜索设备名称、位置或类型" value="${S.list.q}"></label></div>
    </div><div class="dscroll"><div class="dlist"></div></div>`;

  const nx = deviceNext(S.region, d.id);
  return `<div class="dhero">${plinth(d)}<div><div class="hn">${d.name}</div><div class="hm">${KIND[d.kind]} · ${d.loc} · ${regionOf(S.region).name}</div><div class="hs"><i class="lamp ${d.st}"></i>${d.txt}</div></div></div>
    <div class="dnext">${nx ? `下一次 · <b>${dateLabel(nx.date).split(' ')[0]} ${nx.at}</b> ${nx.name} → ${nx.target}` : '没有待执行的任务'}</div>`;
}
function mountDeviceTimeline(host, d, onTask) {
  if (S.devtl === 'DT2') { host.innerHTML = deviceLogHtml(d, onTask); host.querySelectorAll('.lg-card .tcard').forEach(c => c.onclick = () => host._items.find(i => i.id === c.dataset.id)?.onClick()); return; }
  mountTimeline(host, {
    items: () => deviceItems(S.region, d.id, onTask), calendar: 'pill', focusDate: S.focusDate,
    empty: `<b>${d.name}</b>还没有任务或人工操作记录。`,
  });
}
function deviceLogHtml(d, onTask) {
  const items = deviceItems(S.region, d.id, onTask);
  const sorted = [...items].sort((a, b) => absMin(b.date, b.s || b.at) - absMin(a.date, a.s || a.at));
  if (!sorted.length) return `<div class="tl-empty"><b>${d.name}</b>还没有任务或人工操作记录。</div>`;
  let html = '<div class="log">', day = null, nowPlaced = false;
  sorted.forEach(i => {
    const abs = absMin(i.date, i.s || i.at);
    if (i.date !== day) { day = i.date; html += `<div class="lg-day">${dateLabel(day)}</div>`; }
    if (!nowPlaced && abs <= S.now && day === TODAY) { nowPlaced = true; html += `<div class="lg-now"><i></i>现在 ${clockText(S.now)}</div>`; }
    const past = absMin(i.date, i.e || i.at) <= S.now;
    html += `<div class="lg-row${past ? ' past' : ''}"><span class="lg-t">${i.s || i.at}${i.e ? `<small>– ${i.e}</small>` : ''}</span><span class="lg-n${i.e ? ' span' : ''}"></span><div class="lg-card"><div class="tcard ${i.cls}" data-id="${i.id}">${i.html}</div></div></div>`;
  });
  return html + '</div>';
}
function openDevice(devId) {
  const d = devById(S.region, devId);
  if (S.variant === 'P1') {
    const v = document.getElementById('vDevice');
    v.innerHTML = `<div class="navbar"><button class="back" onclick="pop()" aria-label="返回">‹</button><div class="nav-c"><span class="nav-title"><b>${d.name}</b><small>${regionOf(S.region).name}</small></span></div><span class="capsule">···<i></i>⊙</span></div>
      <div class="dview">${heroHtml(d)}<div class="tlhost" id="dvtl"></div></div>`;
    const host = v.querySelector('#dvtl');
    host._items = deviceItems(S.region, d.id, openTask);
    mountDeviceTimeline(host, d, openTask);
    S.stack = ['agent', 'panel', 'device']; syncViews();
  } else if (S.variant === 'P2') {
    pushStack({ title: d.name, meta: d.txt, build: el => {
      el.innerHTML = `<div class="dview">${heroHtml(d)}<div class="tlhost"></div></div>`;
      const host = el.querySelector('.tlhost');
      host._items = deviceItems(S.region, d.id, openTask);
      mountDeviceTimeline(host, d, openTask);
    } });
  } else setP3Focus(devId);
}
function openDeviceShelf(onPick = openDevice) {
  openStack({ title: '设备', meta: `${regionOf(S.region).name} · ${(DEVICES[S.region] || []).length} 台`, build: el => renderDeviceList(el, onPick) });
}

/* ================= cross-screen flows ================= */
function newTask() {
  S.prefill = `在 ${regionOf(S.region).name} 新建任务：`;
  S.stack = ['agent']; closeSheet(); renderAgent(); syncViews();
}
function rebuild(id) {
  const [t] = findTask(id);
  S.prefill = `参照「${t.name}」再建一个任务：`;
  S.stack = ['agent']; closeSheet(); renderAgent(); syncViews();
}
function gotoSource(id) {
  S.stack = ['agent']; closeSheet(); renderAgent(); syncViews();
  const card = document.querySelector(`#vAgent .ctask[data-task="${id}"]`);
  if (!card) { toast('来源对话在另一段会话中（原型未构造该历史）'); return; }
  card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1400);
}
function pop() {
  closeSheet();
  S.stack.pop(); if (!S.stack.length) S.stack = ['agent'];
  syncViews();
  if (S.stack[S.stack.length - 1] === 'agent') renderAgent();
}

/* ================= view stack sync ================= */
const VIEW_IDS = { agent: 'vAgent', panel: 'vPanel', device: 'vDevice' };
function syncViews(animate = true) {
  Object.entries(VIEW_IDS).forEach(([k, id]) => {
    const el = document.getElementById(id), i = S.stack.indexOf(k), top = S.stack.length - 1;
    el.classList.toggle('noanim', !animate);
    el.classList.toggle('off', i < 0);
    el.classList.toggle('under', i >= 0 && i < top);
  });
  syncURL(); renderProtoState();
}
function syncURL() {
  const u = new URL(location);
  const set = { variant: S.variant, drawer: S.drawer, dev: S.dev, devtl: S.devtl, hint: S.hint, cal: S.cal, session: S.session, region: S.region, t: S.now, screen: S.stack.includes('panel') ? 'panel' : 'agent' };
  Object.entries(set).forEach(([k, v]) => u.searchParams.set(k, v));
  history.replaceState(null, '', u);
}
function renderAll() {
  renderAgent();
  if (S.stack.includes('panel')) renderPanel();
}

/* ================= prototype bar ================= */
const KNOBS = [
  ['drawer', '抽屉', [['D1', '阶段'], ['D2', '矩阵']]],
  ['dev', '设备列表', [['L1', '陈列格'], ['L2', '铭牌行']]],
  ['devtl', '设备轴', [['DT1', '同轴'], ['DT2', '履历']]],
  ['hint', '区域提示', [['none', '无'], ['alert', '仅异常'], ['all', '全部']]],
  ['cal', '日历', [['axis', '属于时间轴'], ['page', '属于页面']]],
  ['session', '会话', [['continuous', '跨区域连续'], ['isolated', '按区域隔离']]],
];
function renderProtobar() {
  const cur = VARIANTS.find(v => v[0] === S.variant);
  document.getElementById('protobar').innerHTML = `<div class="pb-row">
      <div class="pb-main"><button onclick="cycleVariant(-1)">‹</button><span>${cur[0]} — ${cur[1]}</span><button onclick="cycleVariant(1)">›</button></div>
      <label class="pb-time">演示时刻 <input id="pbTime" type="range" min="360" max="1380" step="1" value="${S.now}"><output id="pbClock">${clockText(S.now)}</output></label>
    </div>
    <div class="pb-row">${KNOBS.map(([k, label, opts]) => `<span class="knob${k === 'cal' && S.variant !== 'P1' ? ' off' : ''}${k === 'devtl' && S.variant === 'P3' ? ' off' : ''}"><em>${label}</em>${opts.map(([v, l]) => `<button class="${S[k] === v ? 'on' : ''}" onclick="setKnob('${k}','${v}')">${l}</button>`).join('')}</span>`).join('')}</div>
    <div class="pb-state" id="pbState"></div>`;
  document.getElementById('pbTime').oninput = e => setNow(+e.target.value);
  renderProtoState();
}
function renderProtoState() {
  const el = document.getElementById('pbState');
  if (el) el.textContent = `页面栈 ${S.stack.join(' › ')} · 区域 ${regionOf(S.region).name} · 聚焦日期 ${dateLabel(S.focusDate)} · ${S.session === 'continuous' ? '会话连续' : '会话隔离'}`;
}
function cycleVariant(dir) {
  const i = VARIANTS.findIndex(v => v[0] === S.variant);
  S.variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length][0];
  if (S.stack.includes('device')) S.stack = ['agent', 'panel'];
  S.p3Focus = null;
  renderProtobar(); renderAll(); syncViews();
}
function setKnob(k, v) {
  S[k] = v;
  if (k === 'session') S.conv = [...THREADS.r26];
  renderProtobar(); renderAll();
  if (S.stack.includes('device')) S.stack = ['agent', 'panel'];
  syncViews();
}
function setNow(m) {
  S.now = m;
  document.getElementById('pbClock').textContent = clockText(m);
  document.getElementById('statusClock').textContent = clockText(m);
  timelines.forEach(t => t.alive() ? t.render() : timelines.delete(t));
  renderAgent(); syncURL();
}
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycleVariant(-1);
  if (e.key === 'ArrowRight') cycleVariant(1);
  if (e.key === 'Escape') { if (document.getElementById('sheet').classList.contains('open')) closeSheet(); else if (S.stack.length > 1) pop(); }
});

/* ================= boot ================= */
S.conv = [...THREADS.r26];
if (S.region !== 'r26' && S.session === 'continuous') S.conv.push({ div: regionOf(S.region).name });
document.getElementById('statusClock').textContent = clockText(S.now);
renderProtobar();
renderAgent();
if (S.stack.includes('panel')) renderPanel();
syncViews(false);
</script>
</body>
</html>
