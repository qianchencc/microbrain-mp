<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Company Agent · 夜间办公收口原型</title>
  <style>
    :root {
      --paper: #f4f1ea;
      --surface: #fffdf8;
      --ink: #202522;
      --muted: #777c76;
      --line: #ddd8cd;
      --jade: #197966;
      --jade-soft: #e3f0e9;
      --brass: #a46d2c;
      --brass-soft: #f4ead8;
      --red: #a6483c;
      --red-soft: #f6e3df;
      --shadow: 0 16px 42px rgba(57, 50, 38, .10), 0 2px 6px rgba(57, 50, 38, .06);
      font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    button { font: inherit; color: inherit; }
    .page { min-height: 100vh; padding: 28px 20px 52px; }
    .shell { width: min(1080px, 100%); margin: 0 auto; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .eyebrow { color: var(--jade); font-size: 12px; letter-spacing: .09em; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 5px 0 0; font-size: clamp(25px, 4vw, 38px); letter-spacing: -.035em; line-height: 1.08; }
    .prototype-badge { border: 1px solid #cdbb9f; color: var(--brass); background: #fff8eb; border-radius: 999px; padding: 8px 11px; font-size: 12px; white-space: nowrap; }
    .progress { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
    .step { border-top: 2px solid var(--line); padding-top: 9px; color: var(--muted); font-size: 13px; }
    .step.active { color: var(--ink); border-color: var(--jade); font-weight: 700; }
    .step.done { color: var(--jade); border-color: #9bc5b8; }
    .hero { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 26px; border-radius: 10px; }
    .hero-row { display:flex; justify-content:space-between; gap:24px; align-items:flex-start; }
    .kicker { color: var(--muted); font-size: 14px; }
    .hero h2 { font-size: clamp(21px, 3vw, 30px); margin: 7px 0 9px; letter-spacing: -.025em; }
    .hero p { color: var(--muted); margin: 0; line-height: 1.6; max-width: 670px; }
    .status-pill { display:inline-flex; align-items:center; gap:7px; padding: 8px 11px; border-radius: 999px; background: var(--jade-soft); color: var(--jade); font-weight: 700; font-size: 13px; white-space: nowrap; }
    .status-pill.warn { background: var(--brass-soft); color: var(--brass); }
    .status-pill.fail { background: var(--red-soft); color: var(--red); }
    .status-dot { width:7px; height:7px; border-radius:50%; background: currentColor; }
    .metrics { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 25px; }
    .metric { border-top: 1px solid var(--line); padding-top: 12px; }
    .metric strong { display:block; font-size: 23px; letter-spacing: -.03em; }
    .metric span { color: var(--muted); font-size: 12px; }
    .layout { display:grid; grid-template-columns: 1.2fr .8fr; gap: 14px; margin-top: 14px; }
    .section { background: var(--surface); border:1px solid var(--line); border-radius:10px; padding: 21px; }
    .section h3 { margin:0 0 15px; font-size: 16px; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
    .section-note { color:var(--muted); font-size:12px; }
    .scope-line { display:flex; gap:12px; padding: 13px 0; border-top:1px solid #ebe7df; }
    .scope-line:first-of-type { border-top:0; padding-top:0; }
    .scope-icon { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--jade-soft); color:var(--jade); font-size:14px; font-weight:700; flex:0 0 auto; }
    .scope-line strong { display:block; font-size:14px; }
    .scope-line span { display:block; color:var(--muted); font-size:12px; margin-top:4px; line-height:1.45; }
    .exclude { background:#fbf7ee; border:1px solid #eadfca; padding:12px 13px; margin-top: 14px; border-radius:8px; }
    .exclude strong { color:var(--brass); font-size:13px; }
    .exclude p { margin:6px 0 0; color:#75644d; font-size:12px; line-height:1.55; }
    .phase { border-left:3px solid var(--jade); padding: 2px 0 2px 14px; margin: 16px 0; }
    .phase.warn { border-color:var(--brass); }
    .phase.fail { border-color:var(--red); }
    .phase-title { display:flex; justify-content:space-between; gap:12px; font-size:14px; font-weight:700; }
    .phase-time { color:var(--muted); font-size:12px; font-weight:500; }
    .phase p { margin:7px 0 0; color:var(--muted); font-size:12px; line-height:1.5; }
    .phase-result { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
    .result { padding:5px 8px; border-radius:6px; font-size:11px; background:#f0eee8; color:#666b65; }
    .result.ok { color:var(--jade); background:var(--jade-soft); }
    .result.warn { color:var(--brass); background:var(--brass-soft); }
    .result.fail { color:var(--red); background:var(--red-soft); }
    .receipt { border-top:1px solid var(--line); margin-top:18px; padding-top:16px; }
    .receipt-row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; font-size:12px; }
    .receipt-row span:first-child { color:var(--muted); }
    .actionbar { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:20px; }
    .button { border:0; border-radius:7px; padding:11px 16px; cursor:pointer; font-weight:700; font-size:13px; }
    .button.primary { background:var(--jade); color:white; }
    .button.secondary { background:transparent; border:1px solid var(--line); }
    .button:hover { filter:brightness(.97); }
    .controls { display:flex; justify-content:center; gap:7px; flex-wrap:wrap; margin: 20px auto 0; }
    .controls button { border:1px solid var(--line); background:rgba(255,253,248,.72); border-radius:999px; padding:7px 10px; cursor:pointer; font-size:12px; color:var(--muted); }
    .controls button.active { color:var(--jade); border-color:#9bc5b8; background:var(--jade-soft); }
    .footnote { color:var(--muted); text-align:center; font-size:11px; margin-top:14px; }
    @media (max-width: 760px) {
      .page { padding: 20px 13px 36px; }
      .hero, .section { padding:18px; }
      .hero-row { display:block; }
      .status-pill { margin-top:15px; }
      .layout { grid-template-columns:1fr; }
      .metrics { grid-template-columns:repeat(2, 1fr); row-gap:17px; }
      .progress { gap:5px; }
      .step { font-size:11px; }
      .actionbar { justify-content:stretch; }
      .actionbar .button { flex:1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">Company Agent · Operations</div>
          <h1>夜间办公收口</h1>
        </div>
        <div class="prototype-badge">原型 · 示例数据</div>
      </header>
      <nav class="progress" aria-label="任务阶段">
        <div class="step" data-step="plan">1&nbsp; 规划</div>
        <div class="step" data-step="executing">2&nbsp; 执行</div>
        <div class="step" data-step="partial">3&nbsp; 收口</div>
        <div class="step" data-step="complete">4&nbsp; 报告</div>
      </nav>
      <section class="hero" id="hero"></section>
      <div class="layout">
        <section class="section" id="scope"></section>
        <section class="section" id="phases"></section>
      </div>
      <div class="controls" aria-label="原型状态切换">
        <button data-state="plan">待确认</button>
        <button data-state="executing">执行中</button>
        <button data-state="partial">部分完成</button>
        <button data-state="complete">已收口</button>
      </div>
      <p class="footnote">此页面只验证状态模型和信息层级，不连接 Runtime，不执行设备控制。</p>
    </div>
  </main>
  <script>
    const states = {
      plan: {
        title: "今晚 18:30 开始收口",
        desc: "一份任务覆盖 26、27 楼公共办公区。照明先关，空调随后关；会议室、机房和值班区域保留。",
        status: "待确认", tone: "", action: "确认任务",
        metrics: [["156", "照明目标"], ["49", "空调目标"], ["14", "排除设备"], ["2", "执行阶段"]],
        phaseState: ["待确认", "待确认"],
      },
      executing: {
        title: "正在执行夜间收口",
        desc: "计划已固定。当前正在处理第一阶段，第二阶段会按计划继续，不重新搜索设备。",
        status: "第一阶段执行中", tone: "warn", action: "查看执行过程",
        metrics: [["156", "照明目标"], ["49", "空调目标"], ["14", "排除设备"], ["1 / 2", "当前阶段"]],
        phaseState: ["执行中", "等待开始"],
      },
      partial: {
        title: "任务已收口，但结果不完整",
        desc: "两个阶段都已结束。大部分区域完成，仍有 3 台设备没有取得权威回读，未自动重试。",
        status: "部分完成", tone: "warn", action: "查看任务报告",
        metrics: [["202", "目标设备"], ["196", "已核验"], ["3", "结果未知"], ["3", "未受理"]],
        phaseState: ["部分完成", "部分完成"],
      },
      complete: {
        title: "夜间办公收口已完成",
        desc: "所有阶段进入终态。目标设备均已满足或取得权威回读，没有遗留未知结果。",
        status: "已完成", tone: "", action: "查看任务报告",
        metrics: [["202", "目标设备"], ["202", "已核验"], ["0", "结果未知"], ["2 / 2", "阶段完成"]],
        phaseState: ["已完成", "已完成"],
      },
    };
    const state = new URLSearchParams(location.search).get("state") || "plan";
    const current = states[state] || states.plan;
    const phaseTone = current.tone === "warn" ? "warn" : state === "partial" ? "fail" : "";
    document.querySelectorAll(".step").forEach((node, index) => {
      const order = ["plan", "executing", "partial", "complete"];
      const position = order.indexOf(state);
      const stepPosition = order.indexOf(node.dataset.step);
      node.classList.toggle("active", stepPosition === position);
      node.classList.toggle("done", stepPosition < position);
    });
    document.getElementById("hero").innerHTML = `
      <div class="hero-row">
        <div>
          <div class="kicker">一次性多阶段任务 · 2026-10-19</div>
          <h2>${current.title}</h2>
          <p>${current.desc}</p>
        </div>
        <div class="status-pill ${current.tone ? current.tone : ""}"><i class="status-dot"></i>${current.status}</div>
      </div>
      <div class="metrics">${current.metrics.map(([value, label]) => `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`).join("")}</div>
      <div class="actionbar"><button class="button secondary" onclick="location.href='?state=plan'">回看计划</button><button class="button primary" onclick="location.href='?state=${state === "plan" ? "executing" : state === "executing" ? "partial" : "complete"}'">${current.action}</button></div>
    `;
    document.getElementById("scope").innerHTML = `
      <div class="section-head"><h3>操作范围</h3><span class="section-note">已按 Company 目录核验</span></div>
      <div class="scope-line"><div class="scope-icon">照</div><div><strong>26 楼、27 楼公共办公区</strong><span>照明 156 台 · 空调 49 台 · 范围快照已固定</span></div></div>
      <div class="scope-line"><div class="scope-icon">留</div><div><strong>排除范围</strong><span>会议室 6 台 · 机房 4 台 · 值班区域 4 台</span></div></div>
      <div class="exclude"><strong>确认重点</strong><p>排除项必须对应真实设备成员。未解析的“保留区域”不会被当作空排除继续执行。</p></div>
    `;
    const phaseText = state === "partial" ? ["照明：185 / 188 已核验，3 台结果未知", "空调：11 / 14 已核验，3 台未受理"] : state === "complete" ? ["照明：全部目标已满足或已核验", "空调：全部目标已满足或已核验"] : ["关闭 26、27 楼公共办公区照明", "关闭同范围智慧空调"];
    document.getElementById("phases").innerHTML = `
      <div class="section-head"><h3>执行阶段</h3><span class="section-note">同一 Task · ${state === "plan" ? "待确认" : "结果快照"}</span></div>
      <div class="phase ${current.phaseState[0] === "部分完成" ? "fail" : current.phaseState[0] === "执行中" ? "warn" : ""}"><div class="phase-title"><span>01 · 关闭照明</span><span class="phase-time">18:30</span></div><p>${phaseText[0]}</p><div class="phase-result"><span class="result ${state === "plan" ? "" : state === "partial" ? "warn" : "ok"}">${current.phaseState[0]}</span><span class="result">156 台目标</span></div></div>
      <div class="phase ${current.phaseState[1] === "部分完成" ? "fail" : current.phaseState[1] === "等待开始" ? "warn" : ""}"><div class="phase-title"><span>02 · 关闭空调</span><span class="phase-time">20:00</span></div><p>${phaseText[1]}</p><div class="phase-result"><span class="result ${state === "plan" ? "" : state === "partial" ? "warn" : "ok"}">${current.phaseState[1]}</span><span class="result">49 台目标</span></div></div>
      <div class="receipt"><div class="receipt-row"><span>执行政策</span><strong>同控制器串行 · 最多三组并发</strong></div><div class="receipt-row"><span>结果规则</span><strong>未知不重试 · 阶段独立收口</strong></div></div>
    `;
    document.querySelectorAll("[data-state]").forEach(button => {
      button.classList.toggle("active", button.dataset.state === state);
      button.addEventListener("click", () => { location.href = `?state=${button.dataset.state}`; });
    });
  </script>
</body>
</html>
